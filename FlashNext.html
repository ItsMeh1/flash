<script>
/* Flash — tabs.js : multi-tab manager with a view router.
 * Each tab shows either a sandboxed web iframe or a gorgeous flash:// page.
 * chrome omnibox always displays the real URL (https://… or flash://…).
 */
(function (global) {
  "use strict";

  const tabs = [];
  let activeId = null;
  const closedStack = []; // {url, title} for reopen-closed-tab, max 10

  function active() { return tabs.find((t) => t.id === activeId) || null; }
  function all() { return tabs.slice(); }
  function get(id) { return tabs.find((t) => t.id === id) || null; }

  function create(url, opts) {
    opts = opts || {};
    const tab = {
      id: global.FlashUtil.uid("tab"),
      url: url || "flash://newtab",
      title: "New Tab",
      view: "internal",
      internal: "newtab",
      history: [], hIndex: -1,
      zoom: 100,
      pageCache: new Map(), // finalUrl -> {srcdoc, title, t, bytes} (instant back/forward)
      loading: false,
      muted: false,
    };
    tabs.push(tab);
    if (!opts.background) setActive(tab.id);
    renderTabStrip();
    const internal = global.FlashInternal.parse(tab.url);
    if (internal) {
      showInternal(tab, internal, { push: true });
    } else {
      global.FlashApp.loadInTab(tab, tab.url, { push: true });
    }
    return tab;
  }

  function close(id) {
    const i = tabs.findIndex((t) => t.id === id);
    if (i === -1) return;
    const [gone] = tabs.splice(i, 1);
    if (gone.url && !gone.url.startsWith("flash://newtab")) {
      closedStack.push({ url: gone.url, title: gone.title });
      if (closedStack.length > 10) closedStack.shift();
    }
    try {
      const f = document.getElementById("frame-" + gone.id);
      if (f) {
        if (f._flashBlob) { try { URL.revokeObjectURL(f._flashBlob); } catch {} }
        f.remove();
      }
    } catch {}
    document.getElementById("stage")?.querySelectorAll(`[data-iv="${gone.id}"]`).forEach((n) => n.remove());
    try { global.FlashYT.dispose(gone.id); } catch {}
    if (activeId === id) {
      const next = tabs[Math.max(0, i - 1)];
      if (next) setActive(next.id);
      else create("flash://newtab");
    }
    renderTabStrip();
    updateChrome();
  }

  function setActive(id) {
    activeId = id;
    global.FlashInternal.syncAll();
    global.FlashYT.syncAll();
    renderTabStrip();
    updateChrome();
  }

  function showNewtab(tab) {
    showInternal(tab, "newtab", { push: false });
  }

  function showInternal(tab, name, opts) {
    opts = opts || {};
    global.FlashInternal.render(tab, name);
    if (opts.push) {
      tab.history = tab.history.slice(0, tab.hIndex + 1);
      if (tab.history[tab.history.length - 1] !== tab.url) {
        tab.history.push(tab.url);
        tab.hIndex = tab.history.length - 1;
      }
    }
    if (tab.id === activeId) updateChrome();
  }

  // Show the web iframe for a tab (used by viewers + pipeline).
  function showWeb(tab) {
    const stage = document.getElementById("stage");
    stage?.querySelectorAll(`[data-iv="${tab.id}"]`).forEach((n) => {
      n.style.display = "none";
    });
    try { global.FlashYT.dispose(tab.id); } catch {}
    const f = ensureFrame(tab, true);
    tab.view = "web";
    if (tab.id === activeId) f.style.display = "";
    return f;
  }

  function ensureFrame(tab, skipShow) {
    let f = document.getElementById("frame-" + tab.id);
    if (!f) {
      f = document.createElement("iframe");
      f.id = "frame-" + tab.id;
      // Sandboxed: scripts OK, top-escape NOT allowed. No allow-same-origin
      // so proxied origin stays opaque (cookie/storage spoofed by runtime).
      f.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock");
      f.setAttribute("allow", "fullscreen; autoplay; encrypted-media; picture-in-picture;");
      f.referrerPolicy = "no-referrer";
      f.style.display = "none";
      f._flashTab = tab.id;
      f._watchArmed = true;
      // Leak watchdog: any document load we didn't cause (a navigation that
      // escaped the traps would hit the filter raw and die) reloads the last
      // good tunneled page instead of stranding the user on an error page.
      // Our own assignments are counted exactly (see noteFrameAssign): each
      // one produces exactly one load event, consumed below no matter how
      // slow the parse is. The time/cooldown guards remain as backup.
      f.addEventListener("load", () => {
        try {
          if ((f._flashPending || 0) > 0) { f._flashPending--; return; }
          const t = global.FlashTabs.get(f._flashTab);
          if (!t || t.view !== "web" || t.loading) return;
          if (Date.now() - (f._lastAssign || 0) < 4000) return;
          if (t._lastRecover && Date.now() - t._lastRecover < 8000) return;
          if (!t.url || !/^https?:/i.test(t.url)) return;
          if (t._recoveredFor === t.url) return; // one recovery per URL max
          t._lastRecover = Date.now();
          // Prefer the pre-rewrite gesture target (redirector-aware): a fresh
          // click destination reached via tunnel beats reloading the old page.
          // Otherwise fall back to the last good tunneled page. Either way the
          // user never sits on a raw filter error page.
          const g = t._gesture;
          t._gesture = null; // single use — never retry a stale guess
          t._recovering = true;
          if (g && Date.now() - g.t < 10000 && g.url !== t.url && /^https?:/i.test(g.url)) {
            t._recoveredFor = g.url;
            global.FlashApp.toast("Recovered blocked navigation");
            global.FlashApp.loadInTab(t, g.url, { push: true });
            return;
          }
          t._recoveredFor = t.url;
          global.FlashApp.toast("Stopped a direct connection — reloaded last page");
          global.FlashApp.loadInTab(t, t.url, { push: false });
        } catch {}
      });
      document.getElementById("stage").appendChild(f);
    }
    if (!skipShow && tab.view === "web" && tab.id === activeId) f.style.display = "";
    return f;
  }

  function tabFavicon(t) {
    if (t.view === "internal") {
      const ic = global.FlashInternal.ICONS[t.internal] || "zap";
      return `<span class="tab-fav"><i data-icon="${ic}" data-size="12"></i></span>`;
    }
    try {
      const blob = global.FlashApp.faviconFor(t.url);
      if (blob) return `<img class="tab-fav-img" src="${blob}" alt="">`;
    } catch {}
    const h = global.FlashUtil.hostOf(t.url);
    return `<span class="tab-fav">${global.FlashUtil.escapeHtml(((h || "?")[0] || "?").toUpperCase())}</span>`;
  }

  // Drag-to-reorder tab strip (HTML5 DnD, minimal).
  function renderTabStrip() {
    const strip = document.getElementById("tabStrip");
    if (!strip) return;
    let s = {};
    try { s = global.FlashStore.getSettings(); } catch {}
    const dragOn = s.tabDrag !== false;
    const muteOn = s.tabMuteControls !== false;
    strip.innerHTML = "";
    for (const t of tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.id === activeId ? " on" : "") + (t.loading ? " loading" : "");
      el.draggable = !!dragOn;
      el.dataset.id = t.id;
      el.innerHTML = `${tabFavicon(t)}<span class="tab-t">${global.FlashUtil.escapeHtml((t.title || "New Tab").slice(0, 26))}</span>
        ${(t.muted && muteOn) ? `<span class="tab-m" title="Muted — double-click tab to unmute"><i data-icon="mute" data-size="12"></i></span>` : ""}
        <span class="tab-x" title="Close">${global.FlashIcons.svg("x", 13)}</span>`;
      el.onclick = (e) => {
        if (e.target.closest && e.target.closest(".tab-x")) close(t.id);
        else setActive(t.id);
      };
      if (muteOn) {
        el.ondblclick = () => toggleMute(t.id);
        el.querySelector(".tab-m")?.addEventListener("click", (e) => { e.stopPropagation(); toggleMute(t.id); });
      } else {
        el.ondblclick = null;
      }
      if (dragOn) {
        el.ondragstart = (e) => e.dataTransfer.setData("text/tab", t.id);
        el.ondragover = (e) => e.preventDefault();
        el.ondrop = (e) => {
          e.preventDefault();
          const from = e.dataTransfer.getData("text/tab");
          moveTab(from, t.id);
        };
      } else {
        el.ondragstart = null; el.ondragover = null; el.ondrop = null;
      }
      if (s.tabContextMenu !== false) {
        el.oncontextmenu = (e) => {
          e.preventDefault();
          showTabMenu(t, e.clientX, e.clientY);
        };
      } else {
        el.oncontextmenu = null;
      }
      strip.appendChild(el);
    }
    // New-tab button lives inside the strip so it always trails the last tab;
    // sticky keeps it pinned visible even when the strip overflows.
    const add = document.createElement("button");
    add.className = "tab-add";
    add.innerHTML = `<i data-icon="plus" data-size="16"></i>`;
    add.title = "New tab";
    add.setAttribute("aria-label", "New tab");
    add.onclick = () => create("flash://newtab");
    strip.appendChild(add);
    global.FlashIcons.apply(strip);
  }

  function showTabMenu(t, x, y) {
    try {
      document.getElementById("tabCtxMenu")?.remove();
      const m = document.createElement("div");
      m.id = "tabCtxMenu";
      m.style.cssText = `position:fixed;left:${Math.min(x, innerWidth - 200)}px;top:${y}px;z-index:60;min-width:180px;background:var(--panel3);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:var(--sh-menu);`;
      const item = (label, fn) => {
        const b = document.createElement("button");
        b.className = "item";
        b.style.cssText = "display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--txt);";
        b.textContent = label;
        b.onmouseenter = () => { b.style.background = "rgba(255,255,255,.07)"; };
        b.onmouseleave = () => { b.style.background = ""; };
        b.onclick = () => { m.remove(); fn(); };
        m.appendChild(b);
      };
      item(t.muted ? "Unmute tab" : "Mute tab", () => toggleMute(t.id));
      item("Duplicate tab", () => duplicate());
      item("Reload tab", () => global.FlashApp.reload());
      item("Close tab", () => close(t.id));
      item("Close other tabs", () => {
        for (const o of all()) if (o.id !== t.id) close(o.id);
      });
      document.body.appendChild(m);
      const off = (e) => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("click", off); } };
      setTimeout(() => document.addEventListener("click", off), 10);
    } catch {}
  }

  function reopen() {
    const last = closedStack.pop();
    if (!last) {
      global.FlashApp.toast("Nothing to reopen");
      return null;
    }
    return create(last.url);
  }

  function duplicate() {
    const t = active();
    if (!t) return null;
    const nt = create(t.url);
    if (nt && t.view === "web") nt.zoom = t.zoom || 100;
    return nt;
  }

  function moveTab(fromId, toId) {
    const fi = tabs.findIndex((t) => t.id === fromId);
    const ti = tabs.findIndex((t) => t.id === toId);
    if (fi === -1 || ti === -1) return;
    const [m] = tabs.splice(fi, 1);
    tabs.splice(ti, 0, m);
    renderTabStrip();
  }

  function toggleMute(id) {
    const t = get(id || activeId);
    if (!t) return;
    t.muted = !t.muted;
    const f = document.getElementById("frame-" + t.id);
    try {
      f?.contentWindow?.postMessage({ __flash: 2, tab: t.id, type: "mute", muted: t.muted }, "*");
    } catch {}
    renderTabStrip();
  }

  function setLoading(tab, on) {
    tab.loading = on;
    renderTabStrip();
    const anyLoading = tabs.some((x) => x.loading && x.id === activeId);
    document.body.classList.toggle("is-loading", anyLoading);
  }

  function setTitle(tab, title) {
    tab.title = title || tab.url;
    if (tab.id === activeId) updateChrome();
    renderTabStrip();
  }

  function updateChrome() {
    const t = active();
    const s = global.FlashStore.getSettings();
    const omni = document.getElementById("omnibox");
    if (omni) omni.value = t ? t.url : "";
    // lock vs flash glyph in the omnibox
    const oi = document.getElementById("omniIcon");
    if (oi && t) {
      const isFlash = t.url.startsWith("flash://");
      oi.classList.toggle("flash", isFlash);
      oi.innerHTML = global.FlashIcons.svg(isFlash ? "zap" : "lock", 15);
    }
    const star = document.getElementById("btnStar");
    if (star && t) {
      const web = t.url && !t.url.startsWith("flash://");
      const bmOff = (() => { try { return global.FLASH_FEATURES && global.FLASH_FEATURES.bookmarks === false; } catch { return false; } })();
      star.disabled = !web || bmOff;
      const marked = web && global.FlashBookmarks.all().some((b) => b.url === t.url);
      star.classList.toggle("starred", !!marked);
      star.title = !web ? "Bookmarks only apply to web pages" : marked ? "Bookmarked — click to remove" : "Bookmark this page";
    }
    // Shields button: green = all guards on, blue = partial, red = adblock off.
    const pill = document.getElementById("protectPill");
    if (pill) {
      const state = !s.adblockEnabled ? "red" : s.blockWebRTC ? "green" : "blue";
      pill.classList.remove("st-green", "st-blue", "st-red");
      pill.classList.add("st-" + state);
      pill.title = state === "green" ? "Shields up — click to adjust"
        : state === "blue" ? "Partial shields (WebRTC guard off) — click to adjust"
        : "Ad blocker off — click to adjust";
    }
    document.title = "Flash";
    tickClock();
  }

  function tickClock() {
    const s = global.FlashStore.getSettings();
    const show = s.showClock !== false;
    const now = new Date();
    const timeStr = s.clock24h
      ? now.toTimeString().slice(0, 5)
      : now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const dateStr = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    document.querySelectorAll(".nt-time").forEach((el) => { el.style.display = show ? "" : "none"; });
    document.querySelectorAll(".nt-time-text").forEach((el) => { el.textContent = timeStr; });
    document.querySelectorAll(".nt-date").forEach((el) => { el.textContent = dateStr; });
  }
  setInterval(tickClock, 5000);

  // Every programmatic frame assignment produces exactly one load event.
  // Call this at each site so the watchdog consumes its own loads exactly
  // instead of guessing with timers (slow parses outlast any fixed window).
  function noteFrameAssign(frame) {
    try {
      frame._flashPending = (frame._flashPending || 0) + 1;
    } catch {}
  }

  global.FlashTabs = {
    active, all, get, create, close, reopen, duplicate, setActive, showNewtab, showInternal, showWeb,
    ensureFrame, setLoading, setTitle, renderTabStrip, updateChrome, toggleMute, noteFrameAssign,
  };
})(window);

</script>
<!-- MODULE:js/viewers.js -->
<script>
/* Flash — viewers.js : non-HTML rendering (pdf/image/video/audio/text). */
(function (global) {
  "use strict";

  function frameFor(tab) {
    return document.getElementById("frame-" + tab.id);
  }

  // Styling comes ONLY from css/flash.css [standalone-docs], injected here
  // as window.FlashInjectedCSS (generated by tools/build-single-file.py).
  // Never write raw CSS in these templates.
  function docCss() {
    return (global.FlashInjectedCSS || "");
  }

  function showBlobInFrame(tab, blob, kind) {
    const f = frameFor(tab);
    const objUrl = URL.createObjectURL(blob);
    const base = tab.url;
    let inner = "";
    if (kind === "image") {
      inner = `<img id="v" class="fmedia-img" src="${objUrl}">`;
    } else if (kind === "video") {
      inner = `<video id="v" class="fmedia-video" src="${objUrl}" controls autoplay></video>`;
    } else if (kind === "audio") {
      inner = `<audio id="v" class="fmedia-audio" src="${objUrl}" controls autoplay></audio>`;
    }
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${docCss()}</style></head>
      <body class="fcenter">
      <div class="fbar"><span class="vbrand">${global.FlashIcons.svg("zap", 14)} Flash viewer — ${global.FlashUtil.escapeHtml(base)}</span>
      <a class="flink" href="${objUrl}" download>Download</a>
      <button class="fbtn" onclick="document.getElementById('v').style.transform=(document.getElementById('v').style.transform?'':'scale(1.5)')">Zoom</button></div>
      ${inner}<script>parent.postMessage({__flash:1,tab:${JSON.stringify(tab.id)},type:"title",data:{title:"[media] "+${JSON.stringify(base)}}},"*");<\/script>
      </body></html>`;
    f.removeAttribute("srcdoc");
    f.srcdoc = html;
    f._lastAssign = Date.now();
    try { global.FlashTabs.noteFrameAssign(f); } catch {}
    f.style.display = "";
  }

  /* FEATURE:pdf:begin */
  async function showPdf(tab, bytes, url) {
    const f = frameFor(tab);
    // Use in-iframe PDF.js from CDN; bytes passed as base64 to avoid 2nd fetch.
    const b64 = global.FlashUtil.b64encode(bytes);
    const pdfJs = global.FlashConfig.PDFJS_CDN.js;
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${docCss()}</style></head>
      <body class="fdoc">
      <div class="fbar-top"><span class="vbrand">${global.FlashIcons.svg("zap", 14)} Flash PDF — ${global.FlashUtil.escapeHtml(url)}</span>
      <button class="fbtn" id="prev">‹</button><span id="pg">1 / ?</span><button class="fbtn" id="next">›</button>
      <button class="fbtn" id="zin">Zoom+</button><button class="fbtn" id="zout">Zoom−</button></div>
      <div class="fpages" id="pages"></div>
      <script type="module">
      import * as pdfjs from ${JSON.stringify(pdfJs)};
      const raw=Uint8Array.from(atob(${JSON.stringify(b64)}),c=>c.charCodeAt(0));
      const pdf=await pdfjs.getDocument({data:raw}).promise;
      let page=1,scale=1.3;const box=document.getElementById("pages"),lbl=document.getElementById("pg");
      async function draw(){box.innerHTML="";const p=await pdf.getPage(page);const vp=p.getViewport({scale});
        const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
        await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;box.appendChild(cv);lbl.textContent=page+" / "+pdf.numPages;}
      document.getElementById("prev").onclick=()=>{if(page>1){page--;draw();}};
      document.getElementById("next").onclick=()=>{if(page<pdf.numPages){page++;draw();}};
      document.getElementById("zin").onclick=()=>{scale+=0.2;draw();};
      document.getElementById("zout").onclick=()=>{scale=Math.max(0.5,scale-0.2);draw();};
      draw();parent.postMessage({__flash:1,tab:${JSON.stringify(tab.id)},type:"title",data:{title:"[pdf] "+${JSON.stringify(url)}}},"*");
      <\/script></body></html>`;
    f.srcdoc = html;
    f._lastAssign = Date.now();
    try { global.FlashTabs.noteFrameAssign(f); } catch {}
    f.style.display = "";
  }
  /* FEATURE:pdf:end */

  async function showText(tab, bytes, url, contentType) {
    const f = frameFor(tab);
    let text = "";
    try { text = new TextDecoder("utf-8", { fatal: false }).decode(bytes); }
    catch { text = "[binary]"; }
    const esc = global.FlashUtil.escapeHtml(text.slice(0, 500000));
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${docCss()}</style></head>
      <body class="fdoc-mono">
      <div class="fbar-top"><span class="vbrand">${global.FlashIcons.svg("zap", 14)} Flash text — ${global.FlashUtil.escapeHtml(url)} <span class="fmuted">${global.FlashUtil.escapeHtml(contentType || "")} · ${bytes.length} bytes</span></span></div>
      <pre class="ftext">${esc}</pre>
      <script>parent.postMessage({__flash:1,tab:${JSON.stringify(tab.id)},type:"title",data:{title:"[text] "+${JSON.stringify(url)}}},"*");<\/script>
      </body></html>`;
    f.srcdoc = html;
    f._lastAssign = Date.now();
    try { global.FlashTabs.noteFrameAssign(f); } catch {}
    f.style.display = "";
  }

  // Dedicated video theater: title bar, maximized stage, speed + fullscreen.
  function showVideo(tab, blob, url) {
    const f = frameFor(tab);
    const objUrl = URL.createObjectURL(blob);
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${docCss()}</style></head>
      <body class="fdoc" style="display:flex;flex-direction:column;height:100vh;overflow:hidden;">
      <div class="fbar-top"><span class="vbrand">${global.FlashIcons.svg("zap", 14)} Flash video — ${global.FlashUtil.escapeHtml(url)}</span>
      <a class="flink" href="${objUrl}" download>Download</a></div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;">
        <video id="v" src="${objUrl}" controls autoplay style="max-width:96vw;max-height:100%;width:auto;background:#000;border-radius:8px;"></video>
      </div>
      <div class="fbar" style="justify-content:center;gap:12px;border-radius:0;border-left:0;border-right:0;border-bottom:0;">
        <button class="fbtn" id="pp">Pause</button>
        <button class="fbtn" id="spd">1×</button>
        <button class="fbtn" id="fs">Fullscreen</button>
      </div>
      <script>var v=document.getElementById("v");
      document.getElementById("pp").onclick=function(){if(v.paused){v.play();this.textContent="Pause";}else{v.pause();this.textContent="Play";}};
      var speeds=[1,1.25,1.5,2,0.5],si=0;
      document.getElementById("spd").onclick=function(){si=(si+1)%speeds.length;v.playbackRate=speeds[si];this.textContent=speeds[si]+"\\u00d7";};
      document.getElementById("fs").onclick=function(){try{if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();}catch(e){}};
      parent.postMessage({__flash:1,tab:${JSON.stringify(tab.id)},type:"title",data:{title:"[video] "+${JSON.stringify(url)}}},"*");<\/script>
      </body></html>`;
    f.removeAttribute("srcdoc");
    f.srcdoc = html;
    f.style.display = "";
    f._lastAssign = Date.now();
    try { global.FlashTabs.noteFrameAssign(f); } catch {}
  }

  async function renderNonHtml(tab, kind, resp) {
    const ct = (resp.headers["content-type"] || "").split(";")[0];
    let s = {};
    try { s = global.FlashStore.getSettings(); } catch {}
    const on = (k, fb) => (s[k] == null ? fb : s[k] !== false);
    function downloadBlob(blob, name) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
    if (kind === "pdf") {
      if (!on("pdfViewer", true)) {
        downloadBlob(new Blob([resp.body], { type: ct || "application/pdf" }),
          (tab.url.split("/").pop() || "document.pdf").split("?")[0] || "document.pdf");
        global.FlashTabs.setTitle(tab, `[pdf] ${resp.finalUrl}`);
        return;
      }
      /* FEATURE:pdf:begin */
      if (resp.body.length > 25 * 1024 * 1024) {
        // Huge PDFs: offer download instead of in-memory render.
        showBlobInFrame(tab, new Blob([resp.body], { type: "application/pdf" }), "image");
      } else {
        await showPdf(tab, resp.body, resp.finalUrl);
      }
      return;
      /* FEATURE:pdf:end */
      // No viewer in this build: download the file instead.
      const blob = new Blob([resp.body], { type: ct || "application/pdf" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (tab.url.split("/").pop() || "document.pdf").split("?")[0] || "document.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      global.FlashTabs.setTitle(tab, `[pdf] ${resp.finalUrl}`);
      return;
    } else if (kind === "video") {
      if (!on("videoViewer", true)) {
        downloadBlob(new Blob([resp.body], { type: ct || "video/mp4" }),
          (tab.url.split("/").pop() || "video").split("?")[0] || "video");
      } else {
        const blob = new Blob([resp.body], { type: ct || "video/mp4" });
        showVideo(tab, blob, resp.finalUrl);
      }
    } else if (kind === "image" || kind === "audio") {
      const key = kind === "image" ? "imageViewer" : "audioViewer";
      if (!on(key, true)) {
        downloadBlob(new Blob([resp.body], { type: ct || "application/octet-stream" }),
          (tab.url.split("/").pop() || kind).split("?")[0] || kind);
      } else {
        const blob = new Blob([resp.body], { type: ct || "application/octet-stream" });
        showBlobInFrame(tab, blob, kind);
      }
    } else if (kind === "text") {
      if (!on("textViewer", true)) {
        downloadBlob(new Blob([resp.body], { type: ct || "text/plain" }),
          (tab.url.split("/").pop() || "file.txt").split("?")[0] || "file.txt");
      } else {
        await showText(tab, resp.body, resp.finalUrl, ct);
      }
    } else {
      // Unknown MIME: auto-download toggle decides between download and silent fail.
      if (on("autoDownloadUnknown", true)) {
        downloadBlob(new Blob([resp.body], { type: ct || "application/octet-stream" }),
          (tab.url.split("/").pop() || "download").split("?")[0] || "download");
      } else {
        const f = frameFor(tab);
        f.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${docCss()}</style></head><body class="fcard-page"><div class="fcard"><div class="fcard-alert"><span class="fcard-ic">${global.FlashIcons.svg("file", 20)}</span><div><h3>Download blocked by settings</h3><div class="fcard-url">${global.FlashUtil.escapeHtml(resp.finalUrl || tab.url)}</div></div></div><p class="fcard-tip">Turn on “Auto-download unknown file types” in Settings → Files &amp; Media to fetch files like this one.</p></div></body></html>`;
        f._lastAssign = Date.now();
    try { global.FlashTabs.noteFrameAssign(f); } catch {}
        f.style.display = "";
      }
    }
    global.FlashTabs.setTitle(tab, `[${kind}] ${resp.finalUrl}`);
  }

  global.FlashViewers = { renderNonHtml };
})(window);

</script>
<!-- MODULE:js/inspector.js -->
<script>
/* Flash — inspector.js : request metrics, DOM snapshot, element picker results. */
(function (global) {
  "use strict";

  const U = () => global.FlashUtil;
  const esc = (s) => U().escapeHtml(s == null ? "" : String(s));

  function metrics() {
    const m = { heap: null, net: global.FlashLog.all().slice(0, 20), timing: null };
    try {
      if (performance.memory) {
        m.heap = {
          used: U().fmtBytes(performance.memory.usedJSHeapSize),
          total: U().fmtBytes(performance.memory.totalJSHeapSize),
          limit: U().fmtBytes(performance.memory.jsHeapSizeLimit),
        };
      }
    } catch {}
    try {
      const nav = performance.getEntriesByType("navigation")[0];
      if (nav) m.timing = { dom: Math.round(nav.domContentLoadedEventEnd), load: Math.round(nav.loadEventEnd) };
    } catch {}
    return m;
  }

  function renderMetrics() {
    const el = document.getElementById("metricsBox");
    if (!el) return;
    const m = metrics();
    el.innerHTML = `
      <div class="m-row"><span>JS heap</span><b>${m.heap ? `${m.heap.used} / ${m.heap.total}` : "n/a (non-Chromium)"}</b></div>
      <div class="m-row"><span>Transport</span><b>${esc(JSON.stringify(global.FlashTransport.getStatus()))}</b></div>
      <div class="m-row"><span>Tabs</span><b>${global.FlashTabs.all().length}</b></div>
      <div class="m-row"><span>ServiceWorkers</span><b>${"serviceWorker" in navigator ? "present in browser, never used by Flash" : "unsupported"}</b></div>`;
  }

  function activeFrame() {
    const t = global.FlashTabs.active();
    if (!t || t.view !== "web") return null;
    return document.getElementById("frame-" + t.id);
  }

  function postToFrame(msg) {
    const f = activeFrame();
    if (!f) return false;
    try {
      const t = global.FlashTabs.active();
      f.contentWindow.postMessage({ __flash: 2, tab: t.id, ...msg }, "*");
      return true;
    } catch {
      return false;
    }
  }

  // ---- full-page snapshot (now actually answered by the runtime) ----
  function inspectActive() {
    const t = global.FlashTabs.active();
    const out = document.getElementById("domBox");
    if (!t || !out) return;
    const f = document.getElementById("frame-" + t.id);
    if (!f || t.view !== "web") {
      out.textContent = "Snapshot needs the active tab to show a proxied page.";
      return;
    }
    const id = "snap" + Date.now();
    const onMsg = (e) => {
      if (e.data && e.data.__flash === 1 && e.data.tab === t.id && e.data.type === "dom-snapshot" && e.data.data.id === id) {
        window.removeEventListener("message", onMsg);
        out.textContent = (e.data.data.html || "").slice(0, 20000) || "(empty)";
      }
    };
    window.addEventListener("message", onMsg);
    if (!postToFrame({ type: "inspect-snapshot", id })) {
      window.removeEventListener("message", onMsg);
      out.textContent = "(could not reach page)";
      return;
    }
    out.textContent = "Waiting for page snapshot…";
    setTimeout(() => window.removeEventListener("message", onMsg), 5000);
  }

  // ---- click-to-inspect picker ----
  let picking = null;

  function isPicking() { return !!picking; }

  function startPicker() {
    const t = global.FlashTabs.active();
    if (!t || t.view !== "web" || !postToFrame({ type: "inspect-start" })) {
      toast("Open a proxied page first, then inspect.");
      return;
    }
    picking = t.id;
    const box = document.getElementById("inspectResult");
    if (box) box.innerHTML = `<div class="empty">Hover the page to highlight, click an element to inspect it.<br>Esc cancels.</div>`;
    toast("Inspecting — click any element (Esc cancels)");
  }

  function stopPicker(silent) {
    if (!picking) return;
    const t = global.FlashTabs.get(picking);
    picking = null;
    if (t) {
      const f = document.getElementById("frame-" + t.id);
      try {
        f.contentWindow.postMessage({ __flash: 2, tab: t.id, type: "inspect-stop" }, "*");
      } catch {}
    }
    if (!silent) toast("Inspector off");
  }

  function onResult(e) {
    const m = e.data;
    if (!m || m.__flash !== 1 || m.type !== "inspect-result" || !m.data || !m.data.node) return;
    if (m.tab !== picking && picking) return;
    stopPicker(true);
    renderNode(m.data.node);
  }

  function renderNode(n) {
    const box = document.getElementById("inspectResult");
    if (!box || !n) return;
    const sel = `${esc(n.tag)}${n.id ? "#" + esc(n.id) : ""}${n.classes ? "." + esc(String(n.classes).trim().split(/\s+/).join(".")) : ""}`;
    const r = n.rect || {};
    const st = n.styles || {};
    const px = (v) => esc(v || "0px");
    const boxHtml = `
      <div class="bxm"><span class="bxlab">margin ${px(st["margin-top"])} · ${px(st["margin-right"])} · ${px(st["margin-bottom"])} · ${px(st["margin-left"])}</span>
      <div class="bxb"><span class="bxlab">border ${px(st["border-top-width"])} · ${px(st["border-right-width"])} · ${px(st["border-bottom-width"])} · ${px(st["border-left-width"])}</span>
      <div class="bxp"><span class="bxlab">padding ${px(st["padding-top"])} · ${px(st["padding-right"])} · ${px(st["padding-bottom"])} · ${px(st["padding-left"])}</span>
      <div class="bxc">${r.w != null ? `${r.w} × ${r.h}` : "—"}</div>
      </div></div></div>`;
    const attrs = (n.attrs || []).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b><code>${esc(v)}</code></b></div>`).join("") || `<div class="empty">No attributes.</div>`;
    const styleRows = Object.keys(st).filter((k) => st[k] != null && String(st[k]).trim() !== "").map((k) =>
      `<div class="kv"><span>${esc(k)}</span><b><code>${esc(st[k])}</code></b></div>`).join("");
    box.innerHTML = `
      <div class="insp-head"><code>${sel}</code><span class="hint">${r.x != null ? `${r.x},${r.y}` : ""}</span></div>
      ${(n.path || []).length ? `<div class="insp-path">${n.path.map(esc).join(" &gt; ")}</div>` : ""}
      ${boxHtml}
      <div class="insp-sec">Attributes</div>${attrs}
      <div class="insp-sec">Computed styles</div>${styleRows || `<div class="empty">—</div>`}
      ${n.text ? `<div class="insp-sec">Text</div><div class="insp-text">${esc(n.text)}</div>` : ""}
      <div class="insp-sec">HTML</div><pre class="insp-html">${esc(n.html || "")}</pre>`;
  }

  function toast(msg) {
    if (global.FlashApp && global.FlashApp.toast) global.FlashApp.toast(msg);
  }

  window.addEventListener("message", onResult);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && picking) stopPicker();
  });

  global.FlashInspector = { renderMetrics, inspectActive, startPicker, stopPicker, isPicking };
})(window);

</script>
<!-- MODULE:js/settings.js -->
<script>
/* Flash — settings.js : settings store + form fill/collect for the
 * flash://settings internal page + WISP pool + shortcuts + reset.
 * All form access is scoped to a container element (per-tab pages).
 */
(function (global) {
  "use strict";

  let shortcuts = [];

  function current() { return global.FlashStore.getSettings(); }

  // Fill every [data-f] field inside root from stored settings.
  function fillForm(root) {

  function bindNewtab(div, tab) {
    const s = global.FlashStore.getSettings();
    if (s.wallpaper) {
      div.style.backgroundImage = `url("${s.wallpaper.replace(/"/g, "")}")`;
      div.style.backgroundSize = "cover";
    }
    const sel = div.querySelector(".eng-select");
    sel.value = s.searchEngine || "brave";
    sel.onchange = () => {
      global.FlashStore.saveSettings({ searchEngine: sel.value });
      div.querySelector(".nt-input").focus();
    };
    const inp = div.querySelector(".nt-input");
    const go = () => {
      const v = inp.value.trim();
      if (!v) return;
      global.FlashStore.saveSettings({ searchEngine: sel.value });
      global.FlashApp.navigate(v);
    };
    div.querySelector(".nt-go").onclick = go;
    // Enter always navigates as typed; arrowing through suggestions already
    // writes the highlighted pick into the input first.
    inp.onkeydown = (e) => { if (e.key === "Enter") go(); };
    try {
      const sugBox = div.querySelector(".nt-suggest");
      if (sugBox && global.FlashSuggest) {
        global.FlashSuggest.attach(inp, sugBox, (v) => {
          global.FlashStore.saveSettings({ searchEngine: sel.value });
          global.FlashApp.navigate(v);
        });
      }
    } catch {}
    div.querySelector(".nt-bm").onclick = () => global.FlashApp.navigate("flash://bookmarks");
    renderFavTiles(div);
    setTimeout(() => { try { inp.focus(); } catch {} }, 50);
  }

  function renderFavTiles(div) {
    const box = div.querySelector(".nt-favwrap");
    if (!box) return;
    global.FlashFavorites.seedIfEmpty();
    const list = global.FlashFavorites.all().slice(0, 7);
    box.innerHTML =
      list.map((b) => {
        const h = U().hostOf(b.url);
        const letter = U().escapeHtml((h || "?")[0].toUpperCase());
        return `<button class="fav-tile" data-url="${U().escapeHtml(b.url)}" title="${U().escapeHtml(b.url)}">
          <span class="fav-box">${letter}</span><span class="lbl">${U().escapeHtml(b.title || b.url)}</span></button>`;
      }).join("") +
      `<button class="fav-tile dashed" data-add="1" title="${U().escapeHtml(T("addFav"))}">
        <span class="fav-box"><i data-icon="plus" data-size="22"></i></span><span class="lbl">${U().escapeHtml(T("addFav"))}</span></button>`;
    global.FlashIcons.apply(box);
    box.querySelectorAll(".fav-tile[data-url]").forEach((el) => {
      el.onclick = () => global.FlashApp.navigate(el.dataset.url);
    });
    const add = box.querySelector("[data-add]");
    if (add) add.onclick = () => openFavDialog(div);
  }

  function openFavDialog(div) {
    const modal = div.querySelector(".fav-modal");
    if (!modal) return;
    const urlIn = modal.querySelector(".fav-url");
    const titleIn = modal.querySelector(".fav-title");
    const pick = modal.querySelector(".fav-pick");
    urlIn.value = "";
    titleIn.value = "";
    pick.innerHTML = `<option value="">Choose…</option>` + global.FlashBookmarks.all().map((b) =>
      `<option value="${U().escapeHtml(b.url)}">${U().escapeHtml((b.title || b.url).slice(0, 40))}</option>`).join("");
    const close = () => { modal.hidden = true; };
    modal.querySelector(".fav-cancel").onclick = close;
    modal.onclick = (e) => { if (e.target === modal) close(); };
    modal.querySelector(".fav-save").onclick = () => {
      let url = urlIn.value.trim() || pick.value;
      if (!url) { global.FlashApp.toast("Enter a URL first"); return; }
      if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;
      try {
        url = new URL(url).href;
      } catch {
        global.FlashApp.toast("That URL doesn't look valid");
        return;
      }
      if (!/^https?:/i.test(url)) { global.FlashApp.toast("Only web URLs can be favorites"); return; }
      const title = titleIn.value.trim() || U().hostOf(url) || url;
      global.FlashFavorites.add(url, title);
      close();
      renderFavTiles(div);
      global.FlashApp.toast("Favorite added");
    };
    modal.hidden = false;
    setTimeout(() => { try { urlIn.focus(); } catch {} }, 30);
  }

  function bindSettings(div) {
    global.FlashSettings.fillForm(div);
    // Hide controls for build-disabled features (legacy data-feat + new sections).
    try {
      const ff = window.FLASH_FEATURES || {};
      div.querySelectorAll("[data-feat]").forEach((el) => {
        if (ff[el.dataset.feat] === false) el.style.display = "none";
      });
      const hidden = global.FlashStore.hiddenSections();
      div.querySelectorAll("[data-section]").forEach((el) => {
        if (hidden.includes(el.dataset.section)) el.style.display = "none";
      });
      // Locked inputs: disable + title so "removed toggles" read as locked.
      const locked = global.FlashStore.lockedSettings();
      div.querySelectorAll("[data-f]").forEach((el) => {
        if (el.dataset.f in locked) {
          el.disabled = true;
          el.title = "Locked by this custom build";
        }
      });
      // Granular build flags hide their single control (label + input).
      const hideField = (name) => {
        const el = div.querySelector(`[data-f="${name}"]`);
        if (!el) return;
        const row = el.closest(".switch-row") || el;
        // Hide the preceding label too when it's a standalone .f-label.
        let lbl = row.previousElementSibling;
        if (row === el && lbl && lbl.classList && lbl.classList.contains("f-label")) lbl.style.display = "none";
        row.style.display = "none";
      };
      if (ff.wispServer === false) hideField("wispUrl");
      if (ff.concurrentRequests === false) ["idleThreads", "activeThreads", "requestRetries", "maxConnections"].forEach(hideField);
      if (ff.fallbackToggle === false) hideField("fallbackEnabled");
      if (ff.fallbackUrl === false) hideField("fallbackUrl");
      if (ff.retryPolicy === false) ["mainRetries", "fallbackRetries", "retryDelayMs"].forEach(hideField);
      if (ff.errorTriggers === false) ["fallbackOn5xx", "fallbackOnTimeout", "fallbackOnDns"].forEach(hideField);
      if (ff.defaultEngine === false) hideField("searchEngine");
      if (ff.customEngine === false) ["customEngineName", "customEngineUrl"].forEach(hideField);
    } catch {}
    // Cache buttons visibility.
    try {
      if (global.FlashStore.getSettings().showCacheButtons === false) {
        div.querySelectorAll(".cache-btns").forEach((el) => { el.style.display = "none"; });
      }
    } catch {}
    div.querySelector(".set-save").onclick = () => {
      let prevLang = "en";
      try { prevLang = global.FlashStore.getSettings().language || "en"; } catch {}
      const next = global.FlashSettings.collectFrom(div);
      try {
        document.documentElement.lang = next.language || "en";
        if (next.showCacheButtons === false) {
          div.querySelectorAll(".cache-btns").forEach((el) => { el.style.display = "none"; });
        } else {
          div.querySelectorAll(".cache-btns").forEach((el) => { el.style.display = ""; });
        }
        // Language switch: retranslate chrome + refresh this page.
        if ((next.language || "en") !== prevLang) {
          global.FlashApp.applyI18nLabels();
          const t = global.FlashTabs.active();
          if (t && t.view === "internal") global.FlashInternal.render(t, t.internal);
        }
      } catch {}
      global.FlashApp.toast("Settings saved");
    };
    div.querySelector(".set-reset").onclick = () => global.FlashSettings.resetAll();
    const cc = div.querySelector(".cache-clear");
    if (cc) cc.onclick = () => {
      try {
        for (const t of global.FlashTabs.all()) { if (t.pageCache) t.pageCache.clear(); }
        global.FlashLog && global.FlashLog.clear();
      } catch {}
      global.FlashApp.toast("Cache cleared");
    };
    const cr = div.querySelector(".cache-reset");
    if (cr) cr.onclick = () => global.FlashSettings.resetAll();
    const tr = div.querySelector(".tutorial-restart");
    if (tr) tr.onclick = () => {
      try { global.FlashStore.saveSettings({ tutorialDone: false }); } catch {}
      global.FlashApp.startTutorial(true);
    };
  }

  function bindHistory(div) {
    const box = div.querySelector(".h-list");
    const inp = div.querySelector(".h-search");
    const draw = () => {
      if (!global.FlashStore.getSettings().historyEnabled) {
        box.innerHTML = `<div class="empty">History is off — private by default.<br><br><button class="btn primary h-enable">Turn history on</button></div>`;
        const b = box.querySelector(".h-enable");
        if (b) b.onclick = () => {

          draw();
        };
        return;
      }
      renderHistoryList(box, inp.value);
    };
    inp.oninput = draw;

      draw();

  function renderHistoryList(box, q) {
    const all = global.FlashHistory.all();
    const query = (q || "").toLowerCase();
    const items = all
      .map((h, i) => ({ h, i }))
      .filter(({ h }) => !query || (h.title + " " + h.url).toLowerCase().includes(query));
    if (!items.length) {
      box.innerHTML = `<div class="empty">${all.length ? "No matches." : "No history yet — go browse something."}</div>`;
      return;
    }
    const groups = [["Today", 0], ["Yesterday", 1], ["Earlier", 2]];
    const dayOf = (t) => {
      const d = new Date(t);
      const now = new Date();
      const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((today - day) / 86400000);
    };
    let html = "";
    for (const [label, idx] of groups) {
      const rows = items.filter(({ h }) => {
        const dd = dayOf(h.t);
        return idx === 2 ? dd > 1 : dd === idx;
      });
      if (!rows.length) continue;
      html += `<div class="hist-group">${label}</div>` + rows.map(({ h, i }) => {
        const letter = U().escapeHtml(((U().hostOf(h.url) || "?")[0] || "?").toUpperCase());
        const time = new Date(h.t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        return `<div class="hist-wrap">
          <button class="hist-row" data-i="${i}">
            <span class="h-fav">${letter}</span>
            <span class="h-main"><span class="hist-t">${U().escapeHtml(h.title || h.url)}</span>
            <span class="hist-u">${U().escapeHtml(h.url)}</span></span>
            <span class="hist-time">${time}</span>
          </button>
          <button class="ibtn hist-del" data-del="${i}" title="Delete">${I()("x", 15)}</button>
        </div>`;
      }).join("");
    }
    box.innerHTML = html || `<div class="empty">No matches.</div>`;
    box.querySelectorAll(".hist-row").forEach((row) => {
      row.onclick = () => {
        const h = global.FlashHistory.all()[+row.dataset.i];
        if (h) global.FlashApp.navigate(h.url);
      };
    });
    box.querySelectorAll("[data-del]").forEach((b) => {
      b.onclick = (e) => {
        e.stopPropagation();
        global.FlashHistory.removeAt(+b.dataset.del);
        renderHistoryList(box, q);
      };
    });
  }

      grid.querySelectorAll(".bm-card").forEach((c) => {

          draw();

        x.onclick = (e) => {
          e.stopPropagation();

      const t = global.FlashTabs.active();
      if (t && t.url && !t.url.startsWith("flash://")) {
        global.FlashBookmarks.add(t.url, t.title);
        draw();
      } else {
        global.FlashApp.toast("Open a web page first, then bookmark it");
      }
    };
    draw();
  }

  function tplWatch() {
    return `
    <div class="pg">
      <div class="pg-head"><span class="pg-ic"><i data-icon="play" data-size="22"></i></span><h2>Watch</h2></div>
      <p class="pg-sub">Search YouTube through Piped. Everything plays in the built-in theater.</p>
      <div class="nt-searchbox yt-searchbox">
        <input class="nt-input yt-q" placeholder="Search videos…" autocomplete="off" spellcheck="false">

      </div>
      <div class="yt-sec">Trending</div>
      <div class="yt-grid"></div>
    </div>`;
  }

  function ytCard(v) {
    return `<button class="yt-card" data-id="${U().escapeHtml(v.id)}" title="${U().escapeHtml(v.title)}">
      <span class="yt-card-thumb">${v.thumb ? `<img data-tsrc="${U().escapeHtml(v.thumb)}" alt="" loading="lazy">` : ""}
      ${v.duration ? `<span class="yt-dur">${U().escapeHtml(global.FlashYT.fmtDur(v.duration))}</span>` : ""}</span>
      <span class="yt-card-t">${U().escapeHtml(v.title)}</span>
      <span class="yt-card-u">${U().escapeHtml(v.author)}</span></button>`;
  }

  function ytFillThumbs(box) {
    const imgs = Array.from(box.querySelectorAll("img[data-tsrc]")).slice(0, 24);
    for (const img of imgs) {
      const src = img.dataset.tsrc;
      if (!src) continue;
      img.removeAttribute("data-tsrc");
      global.FlashTransport.fetchViaTransport(src, { kind: "image", pageUrl: "https://www.youtube.com/" })
        .then((r) => {
          if (!box.isConnected) return;
          const ct = ((r.headers["content-type"] || "").split(";")[0] || "").trim().toLowerCase();
          if (!r.body || !r.body.length || r.body.length > 400000) return;
          if (ct && !ct.startsWith("image/")) return;
          img.src = URL.createObjectURL(new Blob([r.body], { type: ct || "image/jpeg" }));
        })
        .catch(() => {});
    }
  }

  function bindWatch(div, tab) {
    const grid = div.querySelector(".yt-grid");
    const sec = div.querySelector(".yt-sec");
    const inp = div.querySelector(".yt-q");
    const draw = (items, label) => {
      sec.textContent = label;
      grid.innerHTML = items.length ? items.map(ytCard).join("")
        : `<div class="empty">Nothing found. Try different words.</div>`;
      global.FlashIcons.apply(grid);
      ytFillThumbs(grid);
      grid.querySelectorAll(".yt-card").forEach((c) => {
        c.onclick = () => global.FlashYT.open(tab, c.dataset.id);
      });
    };
    const fail = (e) => {
      grid.innerHTML = `<div class="empty">Couldn't reach any video service.<br>${U().escapeHtml(String((e && e.message) || e).slice(0, 140))}</div>`;
    };
    const search = (q) => {
      q = (q || "").trim();
      if (!q) return;
      grid.innerHTML = `<div class="empty">Searching…</div>`;
      global.FlashYT.searchVideos(q).then((items) => {
        if (!div.isConnected) return;
        draw(items, `Results for “${q}”`);
      }).catch(fail);
    };
    div.querySelector(".yt-go").onclick = () => search(inp.value);
    inp.onkeydown = (e) => { if (e.key === "Enter") search(inp.value); };
    // Bolt handoff ("watch cats") or trending by default.
    let pending = "";
    try {
      pending = global.FlashStore.get("watchQ", "") || "";
      global.FlashStore.remove("watchQ");
    } catch {}
    if (pending) {
      inp.value = pending;
      search(pending);
    } else {
      grid.innerHTML = `<div class="empty">Loading trending…</div>`;
      global.FlashYT.trending("US").then((items) => {
        if (!div.isConnected) return;
        draw(items, "Trending");
      }).catch(fail);
    }
    setTimeout(() => { try { inp.focus(); } catch {} }, 50);
  }

<script>
/* Flash — yt.js : built-in YouTube viewer.
 *
 * Approach (deliberately NOT signature-deciphering): YouTube's web player
 * obfuscates its decipher constantly, so instead we ask the player API as a
 * mobile client, which returns stream URLs that need no deciphering. Same
 * class of trick downloaders have used for years; far more stable than
 * chasing base.js. Everything rides the tunnel (libcurl default).
 *
 * Flow: extract ID -> fetch watch page (API key) -> POST youtubei player API
 * as ANDROID -> pick progressive mp4 (audio+video) -> fetch bytes ->
 * blob URL in the theater <video> (native seeking works on blobs).

(function (global) {

    if ((m = /[?&]v=([A-Za-z0-9_-]{6,})/.exec(s))) return m[1];
    if ((m = /youtu\.be\/([A-Za-z0-9_-]{6,})/i.exec(s))) return m[1];
    if ((m = /youtube(?:-nocookie)?\.com\/(?:shorts|embed|live|v)\/([A-Za-z0-9_-]{6,})/i.exec(s))) return m[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    return "";

  function isYouTube(url) {
    try {
      const h = new URL(url).hostname.toLowerCase();

        h.endsWith(".youtube-nocookie.com");

      return false;
    }
  }

  function canonical(id) {
    return "https://www.youtube.com/watch?v=" + id;
  }

  // Start-time (?t= / ?start=): "90", "1m30s", "1h2m3s".
  function parseStart(url) {

    return (parseInt(m[1] || 0, 10) * 3600) + (parseInt(m[2] || 0, 10) * 60) + parseInt(m[3] || 0, 10);
  }

  function parseApiKey(html) {
    const m = /"INNERTUBE_API_KEY"\s*:\s*"([^"]+)"/.exec(html);
    return m ? m[1] : "";
  }

  async function fetchText(url, body) {
    const headers = { "Content-Type": "application/json" };
    const resp = await global.FlashTransport.fetchViaTransport(url, {
      method: body ? "POST" : "GET",
      headers,
      body: body ? new TextEncoder().encode(body) : undefined,
      kind: "fetch",
      pageUrl: "https://www.youtube.com/",
    });
    return new TextDecoder("utf-8", { fatal: false }).decode(resp.body);
  }

  // Same fetch, but refuses to parse non-JSON — so a dead instance's HTML
  // error page becomes "HTTP 502 (text/html): <snippet>" instead of a
  // cryptic "Unexpected token '<'".
  async function fetchJson(url, body) {
    const headers = body ? { "Content-Type": "application/json" } : {};
    const resp = await global.FlashTransport.fetchViaTransport(url, {
      method: body ? "POST" : "GET",
      headers,
      body: body ? new TextEncoder().encode(body) : undefined,
      kind: "fetch",
      pageUrl: "https://www.youtube.com/",
    });
    const text = new TextDecoder("utf-8", { fatal: false }).decode(resp.body);
    const trimmed = text.trim();
    const ct = ((resp.headers["content-type"] || "").split(";")[0] || "").trim().toLowerCase();
    if (resp.status >= 400) {
      throw new Error("HTTP " + resp.status + " " + trimmed.slice(0, 120));
    }
    if (!ct.includes("json") && !(trimmed.startsWith("{") || trimmed.startsWith("["))) {

  const PIPED_TIMEOUT_MS = 12000;
  const API_TIMEOUT_MS = 15000;

  function withTimeout(p, ms, what) {

      new Promise((_, rej) => setTimeout(() => rej(new Error((what || "request") + " timed out")), ms)),

  // Cached API context (the key is stable for weeks; refetch from homepage).
  async function getApiContext() {

      saved = global.FlashStore.get("ytKey", null);
    } catch (e) {}
    if (saved && saved.key && Date.now() - (saved.t || 0) < 7 * 24 * 3600 * 1000) return saved;
    const html = await withTimeout(fetchText("https://www.youtube.com/?hl=en"), API_TIMEOUT_MS, "homepage");
    const m = /"INNERTUBE_API_KEY"\s*:\s*"([^"]+)"/.exec(html);

    } catch (e) {}

  function parseDuration(s) {
    const parts = String(s || "").trim().split(":").map((x) => parseInt(x, 10));
    if (!parts.length || parts.some(isNaN)) return 0;
    let sec = 0;
    for (const p of parts) sec = sec * 60 + p;
    return sec;
  }

  // Official search API as a WEB client — no Piped needed, verified live.
  async function youtubeiSearch(q) {
    const { key } = await getApiContext();
    const body = JSON.stringify({
      context: { client: { hl: "en", gl: "US", clientName: "WEB", clientVersion: "2.20250101.00.00" } },
      query: q,
    });
    const d = await withTimeout(fetchJson(
      "https://www.youtube.com/youtubei/v1/search?key=" + encodeURIComponent(key) + "&prettyPrint=false",
      body
    ), API_TIMEOUT_MS, "search");
    const out = [];
    const walk = (o) => {
      if (!o || out.length >= 24) return;
      if (Array.isArray(o)) {
        for (const v of o) walk(v);
        return;
      }
      if (typeof o !== "object") return;
      if (o.videoRenderer && typeof o.videoRenderer.videoId === "string") {
        const vr = o.videoRenderer;
        const runs = (x) => ((x || {}).runs || []).map((r) => r.text || "").join("");
        const thumbs = ((vr.thumbnail || {}).thumbnails) || [];
        out.push({
          id: vr.videoId,
          title: runs(vr.title) || "Untitled",
          author: runs(vr.ownerText) || runs(vr.longBylineText),
          duration: parseDuration(((vr.lengthText || {}).simpleText) || ""),
          thumb: thumbs.length ? thumbs[thumbs.length - 1].url : "",
        });
        return;
      }
      for (const k of Object.keys(o)) walk(o[k]);
    };
    walk(d);
    if (!out.length) throw new Error("no results");
    return out;
  }

  async function resolve(id) {
    let firstErr = null;
    // Phase 1: official player API as ANDROID (plain stream URLs).
    try {
      return await resolveYoutubei(id);
    } catch (e) {
      firstErr = e;
    }
    // Phase 2: Piped fallback (separate video+audio, synced in the theater).
    const s = global.FlashStore.getSettings();
    if (s.pipedEnabled) {
      try {
        return await resolvePiped(id, s.pipedInstances);
      } catch (e2) {
        throw new Error(String((firstErr && firstErr.message) || firstErr || "").slice(0, 120) +
          " + piped: " + String((e2 && e2.message) || e2).slice(0, 120));
      }
    }
    throw firstErr;
  }

  async function resolveYoutubei(id) {
    // API key is cached for a week and every call is timed — no hangs.
    const { key } = await getApiContext();
    // 2) player API as ANDROID -> plain stream URLs, no deciphering.
    const payload = JSON.stringify({
      videoId: id,
      racyCheckOk: true,
      contentCheckOk: true,
      context: {
        client: {
          hl: "en", gl: "US",
          clientName: "ANDROID",
          clientVersion: ANDROID_VERSION,
          androidSdkVersion: 30,
        },
      },
    });
    const pr = await withTimeout(fetchJson(
      "https://www.youtube.com/youtubei/v1/player?key=" + encodeURIComponent(key) + "&prettyPrint=false",
      payload
    ), API_TIMEOUT_MS, "player");
    const status = pr.playabilityStatus && pr.playabilityStatus.status;
    if (status && status !== "OK") {
      const reason = (pr.playabilityStatus.reason || status || "unplayable").toString().slice(0, 160);

    const vd = pr.videoDetails || {};
    const thumbs = (vd.thumbnail && vd.thumbnail.thumbnails) || [];
    const all = (sd.formats || []).concat(sd.adaptiveFormats || []);
  // Progressive mp4 only (audio+video in one file). Detected via the codecs
  // list (mp4a/opus/…) or the audio track fields — adaptive video-only would
  // play silent, so it is listed nowhere. Honest error instead. 
  function isProgressive(f) {

    const mt = String(f.mimeType || "");
    if (!mt.startsWith("video/mp4")) return false;
    if (f.audioChannels != null) return true;
    const m = /codecs="([^"]*)"/.exec(mt);
    if (m && /(mp4a|opus|ec-3|ac-3|vorbis|alac|flac)/i.test(m[1])) return true;
    if (/audio/i.test(String(f.audioQuality || ""))) return true;
    return false;
  }
  const prog = all.filter(isProgressive).map((f) => {
      const qm = /(\d{3,4})p/.exec(String(f.qualityLabel || f.quality || ""));
      const h = parseInt((f.size || "").split("x")[1] || f.height || (qm && qm[1]) || 0, 10) || 0;
      return {
        itag: f.itag,
        label: f.qualityLabel || f.quality || (h ? h + "p" : "video"),
        height: h,
        url: f.url,
        bytes: parseInt(f.contentLength || "0", 10) || 0,
      };
    }).sort((a, b) => b.height - a.height);
    if (!prog.length) {
      const hasAny = all.some((f) => f && typeof f.url === "string");
      throw new Error(hasAny
        ? "only silent/adaptive streams here — no playable file"
        : "no streams returned (age-gate, region block, or removed video)");

      id,
      title: vd.title || ("YouTube video " + id),
      author: vd.author || "",
      duration: cleanDur(parseInt(vd.lengthSeconds || "0", 10)),

      formats: prog,
      source: "youtube",
    };
  }

  // Piped fallback: public API instances return separate video-only and
  // audio-only streams. The theater plays them as a synced pair.
  async function resolvePiped(id, instances) {
    const list = (instances && instances.length ? instances : []).map((s) => String(s).trim().replace(/\/+$/, "")).filter(Boolean);
    if (!list.length) throw new Error("no piped instances configured");
    let lastErr = null;
    for (const inst of list) {
      try {

          fetchJson("https://" + inst + "/streams/" + encodeURIComponent(id)),
          PIPED_TIMEOUT_MS, inst

          v && typeof v.url === "string" && /^https?:/i.test(v.url) && v.videoOnly !== false &&
          /mp4|avc1|mp4v/i.test(String(v.codec || "") + String(v.mimeType || "")));
        const audios = (d.audioStreams || []).filter((a) =>
          a && typeof a.url === "string" && /^https?:/i.test(a.url));
        if (!videos.length || !audios.length) throw new Error("empty streams");

          const am = /m4a|mp4a/i.test(String(a.codec || "")) ? 0 : 1;
          const bm = /m4a|mp4a/i.test(String(b.codec || "")) ? 0 : 1;
          return am - bm || ((b.bitrate || 0) - (a.bitrate || 0));
        });
        const audio = audios[0];
        const formats = videos.map((v) => {
          const qm = /(\d{3,4})p/.exec(String(v.quality || ""));
          const h = parseInt(qm && qm[1], 10) || 0;
          return {
            itag: "piped-" + (v.quality || h || "sd"),
            label: (v.quality || (h ? h + "p" : "video")) + " + audio",
            height: h,
            url: v.url,
            bytes: 0,
            audioUrl: audio.url,
          };
        }).sort((a, b) => b.height - a.height);
        if (!formats.length) throw new Error("empty streams");

          id,
          title: d.title || ("YouTube video " + id),
          author: d.uploader || "",
          duration: cleanDur(d.duration),
          thumb: d.thumbnailUrl || "",
          formats,
          source: "piped via " + inst,
        };

        lastErr = e;
      }

    throw new Error("all piped instances failed (" + String((lastErr && lastErr.message) || lastErr).slice(0, 100) + ")");
  }

  // Durations: Piped uses -1/0 for unknown/live; garbage in → 0 (hidden), never -1:-1:-1.
  function cleanDur(v) {
    const n = Math.floor(+v);
    return n > 0 ? n : 0;
  }

  function fmtDur(sec) {
    sec = cleanDur(sec);
    if (!sec) return "";
    const m = Math.floor(sec / 60), s = sec % 60;
    const h = Math.floor(m / 60);

    return h ? `${h}:${pad(m % 60)}:${pad(s)}` : `${m}:${pad(s)}`;

  // ── Piped browse APIs (search + trending), tried across instances ──
  function pipedHosts() {
    let list = [];
    try {
      const s = global.FlashStore.getSettings();
      list = (s.pipedEnabled && s.pipedInstances && s.pipedInstances.length
        ? s.pipedInstances
        : (global.FlashConfig.DEFAULT_SETTINGS.pipedInstances || [])).slice();
    } catch {
      list = (global.FlashConfig.DEFAULT_SETTINGS.pipedInstances || []).slice();
    }

  }

  async function pipedGet(path) {
    const hosts = pipedHosts();
    if (!hosts.length) throw new Error("no piped instances configured (Settings → Video)");
    let lastErr = null;
    for (const h of hosts) {
      try {
        const data = await withTimeout(fetchJson("https://" + h + path), PIPED_TIMEOUT_MS, h);
        return { host: h, data };
      } catch (e) {
        lastErr = e;
      }

    throw new Error("all piped instances failed (" + errMsg(lastErr) + ")");
  }

  function normalizeItems(d) {
    const raw = Array.isArray(d) ? d : (d && d.items) || [];
    const out = [];
    for (const it of raw) {

      let u = String(it.url || "");

      if (u.startsWith("/")) u = "https://www.youtube.com" + u;
      const id = extractId(u);
      if (!id) continue;
      out.push({
        id,
        title: it.title || it.name || "Untitled",
        author: it.uploaderName || it.uploader || "",
        duration: cleanDur(it.duration),
        thumb: it.thumbnail || "",
        views: it.views || 0,
      });
      if (out.length >= 24) break;
    }
    return out;
  }

  async function searchVideos(q) {
    let firstErr = null;
    try {
      return await youtubeiSearch(q);
    } catch (e) {
      firstErr = e;
    }
    try {
      const { data } = await pipedGet("/search?q=" + encodeURIComponent(q) + "&filter=videos");
      const items = normalizeItems(data);
      if (!items.length) throw new Error("no results");
      return items;
    } catch (e2) {
      throw new Error("search failed: " + errMsg(firstErr) + " / piped: " + errMsg(e2));
    }
  }

  async function trending(region) {
    const { data } = await pipedGet("/trending?region=" + encodeURIComponent(region || "US"));
    return normalizeItems(data);
  }

  /* ── theater (stage view owned by this module) ── */
  function stage() { return document.getElementById("stage"); }

  // Remove a tab's theater views, revoking media blob URLs to free memory.
  function dispose(tabId) {
    stage().querySelectorAll(`[data-yt="${tabId}"]`).forEach((n) => {
      try {
        n.querySelectorAll("video, audio").forEach((m) => {
          if (m.src && m.src.startsWith("blob:")) URL.revokeObjectURL(m.src);

    });

  function viewFor(tabId) {
    return stage().querySelector(`[data-yt="${tabId}"]`);
  }

  function syncVisibility(tab) {
    const on = global.FlashTabs.active() === tab;
    stage().querySelectorAll(`[data-yt="${tab.id}"]`).forEach((n) => {
      n.style.display = on ? "" : "none";
    });

  function syncAll() {
    for (const t of global.FlashTabs.all()) {
      if (t.view === "yt") syncVisibility(t);
    }
  }

  function open(tab, videoId) {
    dispose(tab.id);
    const frame = document.getElementById("frame-" + tab.id);
    if (frame) frame.style.display = "none";
    stage().querySelectorAll(`[data-iv="${tab.id}"]`).forEach((n) => { n.style.display = "none"; });

    tab.view = "yt";
    tab.internal = null;
    tab.url = canonical(videoId);

    const div = document.createElement("div");
    div.className = "iv";
    div.dataset.yt = tab.id;
    div.innerHTML = `
      <div class="pg yt-pg">
        <div class="yt-loading"><span class="mini-spinner" style="visibility:visible"></span>
          <span>Resolving streams…</span></div>
      </div>`;
    stage().appendChild(div);
    global.FlashIcons.apply(div);
    global.FlashTabs.setTitle(tab, "Loading video…");
    syncVisibility(tab);
    if (tab.id === global.FlashTabs.active().id) global.FlashTabs.updateChrome();
    load(tab, videoId, div, 0);
  }

  async function load(tab, videoId, div, attempt) {
    let meta;
    try {
      meta = await resolve(videoId);
    } catch (e) {
      if (!div.isConnected) return;
      div.querySelector(".pg").innerHTML = `
        <div class="pg-head"><span class="pg-ic">${I()("alert", 22)}</span><h2>Can't play this video</h2></div>
        <p class="pg-sub">${U().escapeHtml(String((e && e.message) || e).slice(0, 200))}</p>
        <div class="card"><div class="f-row">
          <button class="btn primary yt-retry">Retry</button>
        </div>
        <p class="hint">Some videos are login-walled, age-gated, region-blocked, or streamless for embedded clients. Retrying or another relay sometimes helps.</p></div>`;
      div.querySelector(".yt-retry").onclick = () => open(tab, videoId);
      return;
    }
    if (!div.isConnected) return;
    global.FlashTabs.setTitle(tab, meta.title);
    const quals = meta.formats.map((f, i) =>
      `<button class="btn small yt-q${i === 0 ? " primary" : ""}" data-i="${i}">${U().escapeHtml(f.label)}${f.bytes ? ` · ${fmtBytes(f.bytes)}` : ""}</button>`
    ).join("");
    div.querySelector(".pg").innerHTML = `
      <div class="yt-head">
        ${meta.thumb ? `<img class="yt-thumb" data-tsrc="${U().escapeHtml(meta.thumb)}" alt="">` : ""}
        <div class="yt-meta">
          <h2>${U().escapeHtml(meta.title)}</h2>
          <div class="hint">${U().escapeHtml(meta.author)}${meta.duration ? ` · ${fmtDur(meta.duration)}` : ""}${meta.source && meta.source !== "youtube" ? ` · via ${U().escapeHtml(meta.source)}` : ""}</div>
        </div>
      </div>
      <div class="yt-quals">${quals}</div>
      <div class="yt-status"><span class="mini-spinner" style="visibility:visible"></span><span>Fetching video…</span></div>
      <video class="yt-player" controls playsinline hidden></video>`;
    const thumbEl = div.querySelector(".yt-thumb");
    if (thumbEl) {
      // Thumbnails ride the tunnel too — never a raw pixel.
      global.FlashTransport.fetchViaTransport(meta.thumb, { kind: "image", pageUrl: canonical(meta.id) })
        .then((r) => {
          if (!div.isConnected) return;
          const ct = ((r.headers["content-type"] || "").split(";")[0] || "").trim().toLowerCase();
          if (!r.body || !r.body.length || r.body.length > 500000) return;
          if (ct && !ct.startsWith("image/")) return;

        })
        .catch(() => {});
    }
    const video = div.querySelector(".yt-player");
    const status = div.querySelector(".yt-status");
    const buttons = Array.from(div.querySelectorAll(".yt-q"));
    const fail = (msg) => {
      status.innerHTML = `<span style="color:var(--err-t)">Failed: ${U().escapeHtml(msg)}</span> <button class="btn small yt-retry2">Retry</button>`;
      status.querySelector(".yt-retry2").onclick = () => load(tab, videoId, div, 0);
    };
    buttons.forEach((b) => {
      b.onclick = () => {
        buttons.forEach((x) => x.classList.remove("primary"));
        b.classList.add("primary");
        play(tab, meta, +b.dataset.i, div, video, status, fail);
      };
    });
    play(tab, meta, 0, div, video, status, fail);
  }

  // Dual-element playback for Piped-style video-only + audio pairs. The hidden
  // <audio> mirrors play/pause/seek/rate of the <video>. Torn down on switch.
  function dubFor(div) {
    let au = div.querySelector("audio.yt-dub");
    if (!au) {
      au = document.createElement("audio");
      au.className = "yt-dub";
      au.preload = "auto";
      au.style.display = "none";

  function dropDub(div) {
    const au = div.querySelector("audio.yt-dub");
    if (au) {
      try { au.pause(); } catch {}
      try { if (au.src && au.src.startsWith("blob:")) URL.revokeObjectURL(au.src); } catch {}

      au.remove();

  async function play(tab, meta, i, div, video, status, fail) {
    const f = meta.formats[i];
    if (!f) return;
    const myUrl = tab.url;
    status.innerHTML = `<span class="mini-spinner" style="visibility:visible"></span><span>Fetching ${U().escapeHtml(f.label)}${f.bytes ? ` (${fmtBytes(f.bytes)})` : ""}…</span>`;
    try {
      URL.revokeObjectURL(video.src || "");
    } catch {}
    dropDub(div);

      const jobs = [
        global.FlashTransport.fetchViaTransport(f.url, { kind: "fetch", pageUrl: canonical(meta.id) }),
      ];

        tab._ytStart = 0;

        const au = dubFor(div);
        try { URL.revokeObjectURL(au.src || ""); } catch {}

        au.playbackRate = video.playbackRate || 1;
        video.onplay = () => { try { au.currentTime = video.currentTime; au.play(); } catch {} };
        video.onpause = () => { try { au.pause(); } catch {} };
        video.onseeked = () => { try { au.currentTime = video.currentTime; } catch {} };
        video.onratechange = () => { try { au.playbackRate = video.playbackRate; } catch {} };
        video.onended = () => { try { au.pause(); } catch {} };
      } else {
        video.onplay = video.onpause = video.onseeked = video.onratechange = video.onended = null;
      }
      status.innerHTML = `<span class="hint">${U().escapeHtml(f.label)} · proxied, seekable${f.audioUrl ? " · synced audio" : ""}</span>`;
      try { await video.play(); } catch {}
    } catch (e) {
      if (!fresh()) return;
      fail(String((e && e.message) || e).slice(0, 160));
    }
  }

<script>
/* Flash — assistant.js : AI Assistant sidebar.
 * Online-first, offline-capable: when the device is online it asks a free,
 * keyless text API (no key, no account); when offline or blocked it falls
 * back to a smarter local brain (commands, arithmetic, page outline, browser
 * control). Display name is always "AI Assistant" — the name Bolt is only
 * revealed when the user explicitly asks for its name.
 */
(function (global) {
  "use strict";

  const U = () => global.FlashUtil;
  const I = () => global.FlashIcons.svg;
  const MAX_KEEP = 40;

  const JOKES = [
    "Why do programmers prefer dark mode? Because light attracts bugs.",
    "There are only 10 kinds of people: those who understand binary and those who don't.",
    "A SQL query walks into a bar and asks two tables: “Mind if I join you?”",
  ];
  let jokeIdx = 0;

  function load() { return global.FlashStore.get("chat", []); }
  function save(list) { global.FlashStore.set("chat", list.slice(-MAX_KEEP)); }

  function T(k) {
    try {
      return global.FlashI18n.t(k);
    } catch {
      return k;
    }
  }

  function init() {
    const log = document.getElementById("chatLog");
    if (!log) return;
    renderAll();
    if (!load().length) {
      botSay(T("aiHello"));
    }
    bindChips([[T("chipStatus"), "status"], [T("chipOpen"), "Open example.com"], [T("chipSettings"), "go settings"], [T("chipHelp"), "help"]]);
    document.getElementById("chatForm").onsubmit = (e) => {
      e.preventDefault();
      const inp = document.getElementById("chatInput");
      const v = inp.value.trim();
      if (!v) return;
      inp.value = "";
      userSay(v);
      respond(v);
    };
  }

  function push(role, html) {
    const list = load();
    list.push({ role, html, t: Date.now() });
    save(list);
  }

  function renderAll() {
    const log = document.getElementById("chatLog");
    log.innerHTML = "";
    for (const m of load()) log.appendChild(msgEl(m.role, m.html, false));
    log.scrollTop = log.scrollHeight;
  }

  function msgEl(role, html, animate) {
    const d = document.createElement("div");
    d.className = "chat-msg " + role;
    const ava = role === "bot"
      ? `<span class="ava">${I()("zap", 14)}</span>`
      : `<span class="ava">${I()("arrowRight", 13)}</span>`;
    d.innerHTML = ava + `<div class="bubble">${linkify(html)}</div>`;
    // Internal-page + URL buttons inside bot messages.
    d.querySelectorAll("[data-goto]").forEach((b) => {
      b.onclick = () => global.FlashApp.navigate(b.dataset.goto);
    });
    d.querySelectorAll("[data-cmd]").forEach((b) => {
      b.onclick = () => {
        userSay(b.dataset.cmd);
        respond(b.dataset.cmd);
      };
    });
    return d;
  }

  // flash://settings tokens become buttons; bare https URLs become links.
  function linkify(html) {
    return String(html)
      .replace(/flash:\/\/[a-z]+/g, (m) => ` <button class="act" data-goto="${m}">${m}</button> `)
      .replace(/cmd:([a-z0-9 ]+)/gi, (m, c) => ` <button class="act" data-cmd="${c.trim()}">${c.trim()}</button> `);
  }

  function userSay(text) {
    push("user", U().escapeHtml(text));
    document.getElementById("chatLog").appendChild(msgEl("user", U().escapeHtml(text)));
    scrollDown();
  }

  function botSay(html, chips) {
    const log = document.getElementById("chatLog");
    const ty = document.createElement("div");
    ty.className = "chat-msg bot";
    ty.innerHTML = `<span class="ava">${I()("zap", 14)}</span><div class="bubble typing"><i></i><i></i><i></i></div>`;
    log.appendChild(ty);
    scrollDown();
    const delay = Math.min(1100, 320 + String(html).length * 4);
    setTimeout(() => {
      ty.replaceWith(msgEl("bot", html));
      push("bot", html);
      scrollDown();
      if (chips) bindChips(chips);
    }, delay);
  }

  function scrollDown() {
    const log = document.getElementById("chatLog");
    log.scrollTop = log.scrollHeight;
  }

  // Chips may be plain labels (legacy English map applies) or
  // [label, command] pairs (used for translated labels).
  function bindChips(chips) {
    const box = document.getElementById("chatChips");
    box.innerHTML = chips.map((c) => `<button>${U().escapeHtml(Array.isArray(c) ? c[0] : c)}</button>`).join("");
    box.querySelectorAll("button").forEach((b, i) => {
      b.onclick = () => {
        const item = chips[i];
        const v = Array.isArray(item) ? item[0] : item;
        if (Array.isArray(item)) {
          userSay(v);
          respond(item[1]);
          return;
        }
        // Friendly chip labels map to real commands.
        const map = {
          "Status": "status",
          "Settings": "go settings",
          "Help": "help",
          "History": "go history",
          "Bookmarks": "go bookmarks",
        };
        const cmd = map[v] || v;
        userSay(v);
        respond(cmd);
      };
    });
  }

  function transportLine() {
    const st = global.FlashTransport.getStatus();
    const s = global.FlashStore.getSettings();
    const host = (() => { try { return new URL(s.wispUrl).hostname; } catch { return s.wispUrl; } })();
    return `Engine <b>${U().escapeHtml(st.engine || "none yet")}</b> · relay <b>${U().escapeHtml(host)}</b> · pool <b>${s.poolEnabled ? "on" : "off"}</b>`;
  }

  // Last thing Bolt sent you to — so "open it" / "again" work.
  function remember(url) {
    if (url && /^https?:/i.test(url)) global.FlashStore.set("boltLast", url);
  }
  function recalled() {
    const u = global.FlashStore.get("boltLast", "");
    return u && /^https?:/i.test(u) ? u : "";
  }

  function whereAmI() {
    const t = global.FlashTabs.active();
    if (!t) return "Nowhere — no tabs open.";
    if (t.view === "internal") return `On internal page <b>${U().escapeHtml(t.title)}</b>.`;
    return `On <b>${U().escapeHtml(t.title || t.url)}</b><br>${U().escapeHtml(t.url)}`;
  }

  // Ask the active page for an outline (headings + first paragraphs).
  function pageOutline() {
    return new Promise((resolve) => {
      const t = global.FlashTabs.active();
      const f = t && t.view === "web" ? document.getElementById("frame-" + t.id) : null;
      if (!f) { resolve(null); return; }
      const id = "ol" + Date.now();
      const to = setTimeout(() => { window.removeEventListener("message", onMsg); resolve(null); }, 5000);
      const onMsg = (e) => {
        const m = e.data;
