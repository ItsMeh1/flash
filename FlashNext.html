          clearTimeout(to);
          window.removeEventListener("message", onMsg);
          resolve(m.data);
        }
      };
      window.addEventListener("message", onMsg);
      try {
        f.contentWindow.postMessage({ __flash: 2, tab: t.id, type: "text-extract", id }, "*");
      } catch {
        clearTimeout(to);
        window.removeEventListener("message", onMsg);
        resolve(null);
      }
    });
  }

  function respond(raw) {
    const text = raw.trim();
    const low = text.toLowerCase();
    let m;

    if (/^(hi|hey|hello|yo|sup)\b/.test(low)) {
      return botSay("Hey! Ask me to open or search something, jump to a page, or check the tunnel. “help” lists everything.", ["Status", "Open example.com", "Help"]);
    }
    if (low.includes("help") || low.includes("what can you") || low === "commands" || low === "?") {
      return botSay(
        "Here's my whole trick list:<br>• Ask me <b>anything</b> — online AI answers when connected, offline brain when not<br>• <b>open &lt;url&gt;</b> · <b>search &lt;words&gt;</b> · <b>watch &lt;videos&gt;</b> · <b>calc 2+2</b> · <b>open it</b><br>• <b>go settings | history | bookmarks | watch | home | about</b> · <b>where am i</b><br>• <b>outline</b> — headings + opening of this page<br>• <b>tab 2</b> · <b>close others</b> · <b>new tab</b> · <b>close tab</b><br>• <b>status</b> · <b>engine auto | epoxy | libcurl</b> · <b>relay wss://…</b><br>• <b>theme &lt;name&gt;</b> · <b>bookmark</b> · <b>fav</b> · <b>tabs</b> · <b>shortcuts</b><br>• <b>reload</b> · <b>back</b> · <b>forward</b> · <b>mute</b> · <b>again</b><br>• <b>time</b> · <b>joke</b> · <b>version</b> · <b>clear chat | history | cookies</b><br>Star = bookmark (bar + manager). Pin = favorite (new-tab tile).<br>Try: flash://settings",
        ["Status", "Open example.com", "Settings"]
      );
    }
    if ((m = /^(?:open|go to|visit|browse)\s+(.+)/i.exec(text))) {
      const target = m[1].trim();
      // flash:// pages go directly; everything else is normalized (URL or search).
      const isFlash = /^flash:\/\//i.test(target);
      botSay(`On it — opening <b>${U().escapeHtml(target)}</b>.`, ["Status", "History", "Help"]);
      if (!isFlash) remember(target.startsWith("http") ? target : "https://" + target);
      setTimeout(() => global.FlashApp.navigate(isFlash ? target : target), 450);
      return;
    }
    if ((m = /^(?:search|google|look up|find)\s+(.+)/i.exec(text))) {
      const q = m[1].trim();
      const s = global.FlashStore.getSettings();
      const eng = (global.FlashConfig.SEARCH_ENGINES[s.searchEngine] || global.FlashConfig.SEARCH_ENGINES.brave).url.replace("%s", encodeURIComponent(q));
      botSay(`Searching for <b>${U().escapeHtml(q)}</b>.`, ["Status", "History", "Help"]);
      setTimeout(() => global.FlashApp.navigate(eng), 450);
      return;
    }
    if (/^go\s+customizer|^open\s+customizer|custom build|customize flash|patcher/.test(low)) {
      return botSay("Custom builds live in <b>patcher.html</b> — open that file (next to the app), pick features, download your build. It's separate so it works even on a fresh copy.");
    }
    if ((m = /^go\s+(settings|history|bookmarks?|watch|home|new\s*tab|about)/i.exec(text))) {
      const dest = { settings: "flash://settings", history: "flash://history", bookmarks: "flash://bookmarks", bookmark: "flash://bookmarks", watch: "flash://watch", home: "flash://newtab", "new tab": "flash://newtab", "newtab": "flash://newtab", about: "flash://about" }[m[1].toLowerCase()];
      botSay(`Taking you to <b>${U().escapeHtml(m[1])}</b>.`);
      setTimeout(() => global.FlashApp.navigate(dest), 400);
      return;
    }
    if (/status|transport|engine status|wisp|tunnel|connection/.test(low) && !/^engine\s/.test(low) && !/^relay\s/.test(low)) {
      return botSay("Tunnel report — " + transportLine() + ".<br>Open flash://settings to switch engine or benchmark relays.", ["Settings", "Open example.com", "Help"]);
    }
    if ((m = /^engine\s+(auto|epoxy|libcurl|curl)/i.exec(text))) {
      const v = m[1].toLowerCase() === "curl" ? "libcurl" : m[1].toLowerCase();
      global.FlashStore.saveSettings({ transport: v });
      return botSay(`Engine set to <b>${v}</b>. It applies on your next navigation.`, ["Status", "Open example.com"]);
    }
    if (/^clear(\s+(chat|conversation))?$/.test(low)) {
      save([]);
      document.getElementById("chatLog").innerHTML = "";
      return botSay("Chat cleared. Fresh slate.");
    }
    if (/^clear\s+history/.test(low)) {
      global.FlashHistory.clear();
      return botSay("Browsing history wiped.", ["History", "Help"]);
    }
    if (/^clear\s+cookies/.test(low)) {
      global.FlashCookies.clear();
      return botSay("Saved site cookies wiped. You'll be logged out everywhere.", ["Help"]);
    }
    // Tiny offline calculator. Strict whitelist — digits and operators only.
    if ((m = /^(?:calc|calculate|math)\s+(.+)/i.exec(text)) || (m = /^what is\s+([0-9][0-9+\-*/().\s%^]*)$/i.exec(text))) {
      const expr = m[1].trim();
      if (!/^[0-9+\-*/().\s%^]*$/.test(expr) || /\/\s*0(?![0-9.])/.test(expr)) {
        return botSay("I only do plain arithmetic — digits and <b>+ − * / % ^ ( )</b>.");
      }
      try {
        const val = Function('"use strict";return(' + expr.replace(/\^/g, "**") + ")")();
        if (typeof val !== "number" || !isFinite(val)) throw new Error("nope");
        return botSay(`<b>${U().escapeHtml(expr)}</b> = <b>${Math.round(val * 1e10) / 1e10}</b>`);
      } catch {
        return botSay("Couldn't evaluate that. Try something like <b>calc (12 + 8) * 3</b>.");
      }
    }
    // Browser driving.
    if (/^new\s*tab$/.test(low)) {
      global.FlashTabs.create("flash://newtab");
      return botSay("Fresh tab opened.");
    }
    if (/^close\s*tab$/.test(low)) {
      const t = global.FlashTabs.active();
      if (t) global.FlashTabs.close(t.id);
      return botSay("Tab closed.");
    }
    if (/^(tabs|list tabs)$/.test(low)) {
      const all = global.FlashTabs.all();
      const t = global.FlashTabs.active();
      return botSay(all.length
        ? "Open tabs:<br>" + all.map((x, i) => `${x.id === (t && t.id) ? "● " : "○ "}<b>${U().escapeHtml((x.title || x.url).slice(0, 42))}</b>`).join("<br>")
        : "No tabs open — which shouldn't be possible. Impressive.");
    }
    if (/^(reload|refresh)$/.test(low)) {
      global.FlashApp.reload();
      return botSay("Reloading the current tab.");
    }
    if (/^back$/.test(low)) { global.FlashApp.goBack(); return botSay("Went back."); }
    if (/^forward$/.test(low)) { global.FlashApp.goForward(); return botSay("Went forward."); }
    if (/^(mute|unmute)$/.test(low)) {
      global.FlashTabs.toggleMute();
      const t = global.FlashTabs.active();
      return botSay(t && t.muted ? "Tab muted." : "Tab unmuted.");
    }
    if (/^bookmark( this( page)?)?$/.test(low)) {
      const t = global.FlashTabs.active();
      if (t && t.url && !t.url.startsWith("flash://")) {
        global.FlashBookmarks.add(t.url, t.title);
        global.FlashTabs.updateChrome();

      }
      return botSay("Open a web page first, then I'll pin it.");
    }
    if (/^bookmarks$/.test(low)) {
      const n = global.FlashBookmarks.all().length;
      return botSay(n ? `You have <b>${n}</b> bookmark${n === 1 ? "" : "s"}. Opening the manager…` : "No bookmarks yet — star a page in the address bar.");
    }
    if (/^history$/.test(low)) {
      if (!global.FlashStore.getSettings().historyEnabled) {
        return botSay("History is off — private by default. Turn it on in flash://settings under Privacy.", ["Settings"]);
      }
      const n = global.FlashHistory.all().length;
      if (!n) return botSay("History is empty. Go touch grass — I mean, browse.");
      setTimeout(() => global.FlashApp.navigate("flash://history"), 400);
      return botSay(`<b>${n}</b> entries. Opening history…`);
    }
    if (/^(shortcuts?|keys|hotkeys)$/.test(low)) {
      const rows = global.FlashSettings.loadShortcuts().map((s) => `<b>${U().escapeHtml(s.keys)}</b> — ${U().escapeHtml(s.label || s.action)}`).join("<br>");
      return botSay("Keyboard shortcuts:<br>" + rows + "<br>Rebind them in flash://settings");
    }
    if (/^theme\s+list$/.test(low)) {
      const names = Object.entries(global.FlashConfig.THEMES).map(([id, th]) => id === global.FlashStore.getSettings().theme ? `<b>${th.name}</b> (current)` : th.name).join(" · ");
      return botSay("Themes: " + names + "<br>Say <b>theme &lt;name&gt;</b> to switch.");
    }
    if ((m = /^theme\s+([a-z]+)/i.exec(text))) {
      const want = m[1].toLowerCase();
      const hit = Object.keys(global.FlashConfig.THEMES).find((id) => id === want || global.FlashConfig.THEMES[id].name.toLowerCase() === want);
      if (!hit) return botSay(`No theme called “${U().escapeHtml(m[1])}”. Say <b>theme list</b>.`);
      global.FlashStore.saveSettings({ theme: hit });
      global.FlashSettings.applyAppearance();
      return botSay(`Theme set to <b>${global.FlashConfig.THEMES[hit].name}</b>.`);
    }
    if ((m = /^relay\s+(wss?:\/\/\S+)/i.exec(text))) {
      global.FlashStore.saveSettings({ wispUrl: m[1] });
      return botSay(`Relay set to <b>${U().escapeHtml(m[1])}</b>. Applies on your next navigation.`, ["Status"]);
    }
    if (/^(version|build|about flash)$/.test(low)) {
      const b = global.FlashBuild || { n: 0, state: "" };
      const at = b.at ? ` · ${b.at}` : "";
      return botSay(`Flash <b>v${global.FlashConfig.VERSION}</b> · build <b>#${b.n} ${U().escapeHtml(b.state || "")}</b>${U().escapeHtml(at)} · single file, no service workers. Full tour: flash://about`);
    }
    if (/privacy|shields|protection|adblock|tracking/.test(low)) {
      const s = global.FlashStore.getSettings();
      return botSay(`Shields: adblock <b>${s.adblockEnabled ? "on" : "off"}</b> · cosmetic <b>${s.cosmeticFiltering ? "on" : "off"}</b> · WebRTC guard <b>${s.blockWebRTC ? "on" : "off"}</b> · cookies isolated per site. Tune it all in flash://settings`, ["Settings"]);
    }
    if (/reset|start over|wipe/.test(low)) {
      return botSay("Reset lives in flash://settings under Danger zone — it asks for confirmation first, because some mistakes shouldn't be one-liners.");
    }
    if (/^(fav|favorite|favourite|pin)( this)?$/.test(low)) {
      const t = global.FlashTabs.active();
      if (t && t.url && !t.url.startsWith("flash://")) {
        const had = global.FlashFavorites.has(t.url);
        global.FlashFavorites.toggle(t.url, t.title);
        return botSay(had ? "Unpinned from your new tab." : `Pinned <b>${U().escapeHtml(t.title || t.url)}</b> to your new tab.`, ["Help"]);

    }
    if (/^(favorites|favourites|pins)$/.test(low)) {
      const n = global.FlashFavorites.all().length;
      return botSay(n ? `You have <b>${n}</b> favorite${n === 1 ? "" : "s"} on your new tab. Manage them from any bookmark card's pin button.` : "No favorites yet — pin pages from flash://bookmarks and they'll show on every new tab.");
    }
    if (/\btime\b/.test(low)) {
      return botSay("It's <b>" + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + "</b>.", ["Status", "Help"]);
    }
    if (/\b(date|today|day)\b/.test(low)) {
      return botSay("Today is <b>" + new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" }) + "</b>.");
    }
    if (/joke|funny|make me laugh/.test(low)) {
      const j = JOKES[jokeIdx % JOKES.length];
      jokeIdx += 1;
      return botSay(U().escapeHtml(j), ["Help"]);
    }
    if (/what('s| is) your name|^your name$|what are you called|your nickname/.test(low)) {
      return botSay("My name is <b>Bolt</b>.", ["Help", "Status"]);
    }
    if (/who are you|about you|are you (ai|real)|ai\b/.test(low)) {
      return botSay("I'm the <b>AI Assistant</b> built into FlashNext — online AI when you're connected, on-device brain when you're not. No account, no key, chat stays in this browser.", ["Help", "Status"]);
    }
    if (/thank|thx|nice|cool|awesome|great/.test(low)) {
      return botSay("Anytime. I live in the sidebar if you need a shortcut with opinions.", ["Open example.com", "Status"]);
    }
    if (/^(where am i|current( page| tab)?|this page|what tab( am i on)?)$/.test(low)) {
      const t = global.FlashTabs.active();
      if (t && t.url && !t.url.startsWith("flash://")) remember(t.url);
      return botSay(whereAmI(), ["Status", "Help"]);
    }
    if (/^(open it|go there|take me there|that one)$/.test(low)) {
      const u = recalled();
      if (!u) return botSay("I don't have anything remembered yet — tell me a URL first.");
      botSay(`Back to <b>${U().escapeHtml(u)}</b>.`);
      setTimeout(() => global.FlashApp.navigate(u), 400);
      return;
    }
    if (/^(again|retry|reload it|try again)$/.test(low)) {
      global.FlashApp.reload();
      return botSay("Reloading.");
    }
    if (/^(outline|summary|summarize|summarise|tldr|tl;dr|what is this (page )?about|describe this page)$/.test(low)) {

<script>
/* FlashNext — extensions.js : tiny userscript-style extension system.
 * Manifest format (JSON):
 *   { id?, name, version?, author?, desc?, js?, css? }
 * Page scripts run inside the sandboxed page (DOM access, no chrome access);
 * CSS is appended as well. Storage: flash:extensions (customs only);
 * built-ins ship in code and can only be toggled, never removed.
 * Install sources: paste JSON, or fetch a manifest URL through the WISP
 * tunnel (kind: fetch) so filters only see wss:// traffic.
 */
(function (global) {
  "use strict";

  const KEY = "extensions";
  const MAX_FIELD = 100 * 1024;

  const BUILTINS = [
    {
      id: "force-dark", name: "Force Dark", version: "1.0.0", author: "FlashNext",
      desc: "Dark background with light text on bright pages.",
      css: "html{background:#0d1424!important}body{background:#0d1424!important;color:#e9efff!important}a{color:#7aa2ff!important}",
      js: "",
    },
    {
      id: "focus-mode", name: "Focus Mode", version: "1.0.0", author: "FlashNext",
      desc: "Hides sidebars, comment sections and recommendation rails.",
      css: "aside,[class*=sidebar],[class*=rail],[id*=comments],[class*=comments],[class*=recommend],[id*=recommend]{display:none!important}main,article{max-width:900px!important;margin:0 auto!important}",
      js: "",
    },
    {
      id: "wide-video", name: "Wide Video", version: "1.0.0", author: "FlashNext",
      desc: "Lets HTML5 video use the full content width.",
      css: "video{max-width:100%!important;width:100%!important;height:auto!important}",
      js: "",
    },
  ];

  function customs() {
    try {
      const list = global.FlashStore.get(KEY, []);
      return Array.isArray(list) ? list : [];
    } catch {
      return [];
    }
  }

  function saveCustoms(list) {
    global.FlashStore.set(KEY, list);
  }

  function stateMap() {
    try {
      return global.FlashStore.get("extState", {});
    } catch {
      return {};
    }
  }

  // All extensions with effective enabled flag (default: off for built-ins).
  function all() {
    const st = stateMap();
    const out = BUILTINS.map((b) => ({
      ...b, builtin: true, enabled: !!st[b.id],
    }));
    for (const c of customs()) {
      out.push({ ...c, builtin: false, enabled: c.enabled !== false });
    }
    return out;
  }

  function setEnabled(id, on) {
    const custom = customs().find((c) => c.id === id);
    if (custom) {
      custom.enabled = !!on;
      saveCustoms(customs());
    } else {
      const st = stateMap();
      st[id] = !!on;
      global.FlashStore.set("extState", st);
    }
  }

  function slug(s) {
    return String(s || "ext").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "ext";
  }

  function validate(m) {
    if (!m || typeof m !== "object") throw new Error("not an object");
    if (!m.name || typeof m.name !== "string") throw new Error("missing name");
    const js = (m.js != null ? String(m.js) : "").replace(/<\/script/gi, "<\\/script");
    const css = (m.css != null ? String(m.css) : "").replace(/<\/style/gi, "<\\/style");
    if (js.length > MAX_FIELD || css.length > MAX_FIELD) throw new Error("too large (100KB max per field)");
    if (!js.trim() && !css.trim()) throw new Error("empty: needs js or css");
    return {
      id: slug(m.id || m.name) + "-" + Date.now().toString(36),
      name: String(m.name).slice(0, 80),
      version: String(m.version || "1.0").slice(0, 20),
      author: String(m.author || "?").slice(0, 60),
      desc: String(m.desc || "").slice(0, 300),
      js, css, enabled: true,
    };
  }

  function add(manifest) {
    const clean = validate(manifest);
    const list = customs();
    // Same name+version replaces (re-install), otherwise append. Cap 50.
    const i = list.findIndex((c) => c.name === clean.name && c.version === clean.version);
    if (i >= 0) list[i] = { ...clean, id: list[i].id };
    else list.push(clean);
    saveCustoms(list.slice(-50));
    return clean;
  }

  function addFromJson(text) {
    let m;
    try {
      m = JSON.parse(String(text));
    } catch {
      throw new Error("invalid JSON");
    }
    return add(m);
  }

  async function addFromUrl(url) {
    const abs = /^https?:\/\//i.test(url) ? url : "https://" + url;
    const r = await global.FlashTransport.fetchViaTransport(abs, { kind: "fetch", pageUrl: "flash://store" });
    const text = new TextDecoder("utf-8", { fatal: false }).decode(r.body).slice(0, 300000);
    return addFromJson(text);
  }

  function remove(id) {
    saveCustoms(customs().filter((c) => c.id !== id));
  }

  // Concatenated extras for the page renderer (enabled only).
  function pageExtras() {
    let css = "", js = "";
    for (const e of all()) {
      if (!e.enabled) continue;
      if (e.css) css += "\n/* ext:" + e.id + " */\n" + e.css;
      if (e.js) js += "\n/* ext:" + e.id + " */\n" + e.js;
    }
    return { css, js };
  }

  global.FlashExtensions = {
    all, setEnabled, add, addFromJson, addFromUrl, remove, pageExtras, BUILTINS,
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<!-- MODULE:js/suggest.js -->
<script>
/* FlashNext — suggest.js : fast search suggestions for omnibox + new tab.
 * Provider chain, fetched THROUGH the WISP tunnel (never direct fetch):
 *   DuckDuckGo autocomplete -> Brave suggest -> Bing osjson.
 * Direct fetch is unusable here: from file:// the origin is `null` and all
 * three providers refuse it via CORS (console spam, zero results). The WASM
 * engines do their own TLS and ignore browser CORS entirely, so tunneled
 * suggestions just work — on file://, http(s), and hosted alike.
 * First success wins; anything failing falls through silently. Debounced,
 * keyboard-navigable (up/down/enter/esc), gated by the searchSuggest setting.
 * A 6s cap keeps the dropdown snappy; stale keystrokes are discarded.
 */
(function (global) {
  "use strict";

  const DEBOUNCE_MS = 180;
  const MIN_LEN = 2;
  const SUGGEST_TIMEOUT_MS = 6000;

  function suggestOn() {
    try {
      return global.FlashStore.getSettings().searchSuggest !== false;
    } catch {
      return true;
    }
  }

  function isUrlLike(q) {
    const s = q.trim();
    return /^https?:\/\//i.test(s) || global.FlashUtil.isProbablyUrl(s);
  }

  // One autocomplete API call over the tunnel. Throws on any failure so the
  // chain falls through to the next provider.
  async function tunnelJson(url, pick) {
    const r = await global.FlashTransport.fetchViaTransport(url, {
      kind: "fetch", pageUrl: "flash://newtab",
    });
    if (!r || r.status >= 400 || !r.body || !r.body.length) throw new Error("bad response");
    let j;
    try {
      j = JSON.parse(new TextDecoder("utf-8").decode(r.body));
    } catch {
      throw new Error("bad json");
    }
    const out = pick(j);
    if (!Array.isArray(out) || !out.length) throw new Error("empty");
    return out.slice(0, 8);
  }

  const isStr = (x) => typeof x === "string" && x.trim().length > 0;

  async function fetchSuggestions(q) {
    const enc = encodeURIComponent(q);
    // DuckDuckGo (list shape: [query, [suggestions...]]).
    try {
      const r = await tunnelJson("https://duckduckgo.com/ac/?q=" + enc + "&type=list",
        (j) => (Array.isArray(j) && Array.isArray(j[1]) ? j[1].filter(isStr) : null));
      if (r) return r;
    } catch {}
    // Brave suggest (defensive: array or {suggestions/results} shapes).
    try {
      const r = await tunnelJson("https://search.brave.com/api/suggest?q=" + enc, (j) => {
        if (Array.isArray(j)) return j.filter(isStr);
        if (j && Array.isArray(j.suggestions)) return j.suggestions.map((x) => x.text || x.value || x).filter(isStr);
        if (j && Array.isArray(j.results)) return j.results.map((x) => x.title || x.text).filter(isStr);
        return null;
      });
      if (r) return r;
    } catch {}
    // Bing osjson ([query, [suggestions...]]).
    try {
      const r = await tunnelJson("https://api.bing.com/osjson.aspx?query=" + enc,
        (j) => (Array.isArray(j) && Array.isArray(j[1]) ? j[1].filter(isStr) : null));
      if (r) return r;
    } catch {}
    return [];
  }

  function withTimeout(ms) {
    return new Promise((_, rej) => setTimeout(() => rej(new Error("suggest timeout")), ms));
  }

  // Attach to an input + dropdown box. onPick(text) navigates.
  function attach(input, box, onPick) {
    if (!input || !box) return;
    let items = [], active = -1, timer = 0, seq = 0;

    function hide() {
      box.hidden = true;
      box.innerHTML = "";
      items = [];
      active = -1;
    }

    function draw() {
      if (!items.length) { hide(); return; }
      const U = global.FlashUtil;
      box.innerHTML = items.map((s, i) =>
        `<button class="sug-row${i === active ? " on" : ""}" data-i="${i}">${U.escapeHtml(s)}</button>`
      ).join("");
      box.hidden = false;
      box.querySelectorAll(".sug-row").forEach((row) => {
        row.onmousedown = (e) => {
          e.preventDefault(); // keep focus so enter/esc still work
          const v = items[+row.dataset.i];
          hide();
          onPick(v);
        };
      });
    }

    input.addEventListener("input", () => {
      clearTimeout(timer);
      const q = input.value;
      if (!suggestOn() || q.trim().length < MIN_LEN || isUrlLike(q)) { hide(); return; }
      timer = setTimeout(async () => {
        const my = ++seq;
        // 6s cap: a hung provider must never hold the dropdown hostage.
        // Stale keystrokes are discarded by the seq guard below.
        const list = await Promise.race([fetchSuggestions(q.trim()), withTimeout(SUGGEST_TIMEOUT_MS)])
          .catch(() => []);
        if (my !== seq) return; // superseded
        // Dedupe + drop the exact query itself.
        const seen = new Set();
        items = list.filter((s) => {
          const k = s.toLowerCase();
          if (k === q.trim().toLowerCase() || seen.has(k)) return false;
          seen.add(k);
          return true;
        }).slice(0, 8);
        active = -1;
        draw();
      }, DEBOUNCE_MS);
    });

    input.addEventListener("keydown", (e) => {
      if (box.hidden || !items.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        active = e.key === "ArrowDown"
          ? (active + 1) % items.length
          : (active - 1 + items.length) % items.length;
        input.value = items[active];
        draw();
      } else if (e.key === "Escape") {
        hide();
      }
    });

    input.addEventListener("blur", () => {
      // Let mousedown on rows win first.
      setTimeout(hide, 150);
    });
  }

  global.FlashSuggest = { attach, fetchSuggestions };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<!-- MODULE:js/tutorial.js -->
<script>
/* FlashNext — tutorial.js : richer guided tour with spotlight steps.
 * Each step points at a real chrome element (glow ring + anchored card);
 * steps whose element is missing (stripped builds) are skipped silently.
 * Esc skips. Finishing (or Skip) sets tutorialDone so it never auto-launches.
 */
(function (global) {
  "use strict";

  const STEPS = [
    { sel: "#omniWrap", key: "s1" },
    { sel: "#tabStrip", key: "s2" },
    { sel: "#protectPill", key: "s3" },
    { sel: "#btnAssistant", key: "s4" },
    { sel: "#btnCode", key: "s5" },
    { sel: "#btnApps", key: "s6" },
    { sel: null, key: "s7" },
  ];

  let idx = 0;

  function t(k) {
    try {
      return global.FlashI18n.t(k);
    } catch {
      return k;
    }
  }

  function tutOff() {
    try {
      const ff = global.FLASH_FEATURES || {};
      return ff.tutorial === false || ff.showTutorial === false || ff.tutorialInclude === false;
    } catch {
      return false;
    }
  }

  function visibleSteps() {
    return STEPS.filter((s) => !s.sel || document.querySelector(s.sel));
  }

  function init() {
    const next = document.getElementById("tutNext");
    const back = document.getElementById("tutBack");
    const skip = document.getElementById("tutSkip");
    if (next) next.onclick = () => {
      const steps = visibleSteps();
      if (idx >= steps.length - 1) finish();
      else { idx += 1; draw(); }
    };
    if (back) back.onclick = () => {
      if (idx > 0) { idx -= 1; draw(); }
    };
    if (skip) skip.onclick = () => finish();
    window.addEventListener("keydown", (e) => {
      const ov = document.getElementById("tutorialOverlay");
      if (e.key === "Escape" && ov && !ov.hidden) finish();
    });
  }

  function start() {
    if (tutOff()) return;
    const steps = visibleSteps();
    if (!steps.length) return;
    idx = 0;
    const ov = document.getElementById("tutorialOverlay");
    if (!ov) return;
    ov.hidden = false;
    draw();
  }

  function finish() {
    const ov = document.getElementById("tutorialOverlay");
    if (ov) ov.hidden = true;
    const glow = document.getElementById("tutGlow");
    if (glow) glow.style.display = "none";
    try {
      global.FlashStore.saveSettings({ tutorialDone: true });
    } catch {}
  }

  function draw() {
    const steps = visibleSteps();
    const step = steps[Math.min(idx, steps.length - 1)];
    const ov = document.getElementById("tutorialOverlay");
    const card = document.getElementById("tutCard");
    const glow = document.getElementById("tutGlow");
    if (!ov || !card) return;

    const title = document.getElementById("tutTitle");
    const body = document.getElementById("tutStep");
    const dots = document.getElementById("tutDots");
    const back = document.getElementById("tutBack");
    const next = document.getElementById("tutNext");
    const skip = document.getElementById("tutSkip");
    if (title) title.textContent = t("tutWelcome");
    if (body) body.textContent = (idx + 1) + ". " + t(step.key);
    if (dots) {
      dots.innerHTML = steps.map((_, i) =>
        `<i class="${i === idx ? "on" : ""}"></i>`).join("");
    }
    if (back) {
      back.textContent = t("backB");
      back.style.visibility = idx === 0 ? "hidden" : "";
    }
    if (next) next.textContent = idx >= steps.length - 1 ? t("finish") : t("next");
    if (skip) skip.textContent = t("skip");

    // Spotlight + anchored card.
    const el = step.sel ? document.querySelector(step.sel) : null;
    if (el && glow) {
      const r = el.getBoundingClientRect();
      const pad = 6;
      glow.style.display = "block";
      glow.style.left = Math.max(4, r.left - pad) + "px";
      glow.style.top = Math.max(4, r.top - pad) + "px";
      glow.style.width = (r.width + pad * 2) + "px";
      glow.style.height = (r.height + pad * 2) + "px";
      // Card below the target when room, else above, else centered.
      card.style.position = "fixed";
      card.style.margin = "0";
      card.style.maxWidth = "340px";
      const below = r.bottom + 12;
      const estH = 220;
      if (below + estH < innerHeight) {
        card.style.top = below + "px";
        card.style.bottom = "auto";
      } else if (r.top - estH - 12 > 0) {
        card.style.bottom = (innerHeight - r.top + 12) + "px";
        card.style.top = "auto";
      } else {
        card.style.top = "50%";
        card.style.bottom = "auto";
        card.style.transform = "translate(-50%,-50%)";
        card.style.left = "50%";
      }
      if (card.style.transform !== "translate(-50%,-50%)") {
        card.style.transform = "none";
        const cx = Math.min(Math.max(r.left, 12), innerWidth - 364);
        card.style.left = cx + "px";
      }
    } else {
      if (glow) glow.style.display = "none";
      card.style.position = "";
      card.style.transform = "";
      card.style.left = "";
      card.style.top = "";
      card.style.bottom = "";
      card.style.maxWidth = "420px";
    }
    try {
      global.FlashIcons.apply(card);
    } catch {}
  }

  global.FlashTutorial = { init, start, finish };
})(typeof window !== "undefined" ? window : globalThis);

</script>

<script>
/* Flash — app.js : boot, omnibox, navigation pipeline, iframe message bridge.
 *
 * Pipeline (per navigation):
 *  1. normalize input -> absolute https URL (or flash://newtab)
 *  2. adblock host check -> block page
 *  3. FlashTransport.fetchViaTransport (Epoxy over WISP, pool failover, direct fallback)
 *  4. sniff content-kind -> page (rewrite+inject+srcdoc) or viewer (pdf/img/video/audio/text)

 *

 * There are zero ServiceWorkers, zero server-side proxy endpoints.
 */

    }

  // and after Settings save (language switch).

    } catch {}

    const internal = global.FlashInternal.parse(url);
    if (internal) {
      global.FlashTabs.showInternal(tab, internal, { push: opts.push });
      setStatus("Internal page");
      return;
    }
    // YouTube gets its built-in theater (stream extraction + blob playback).
    // Skipped in raw mode and in builds without the feature.
    let ytOff = false;
    try {
      ytOff = global.FLASH_FEATURES && global.FLASH_FEATURES.youtube === false;
    } catch {}
    if (!opts.raw && !ytOff && global.FlashYT.isYouTube(url)) {
      const ytId = global.FlashYT.extractId(url);
      if (ytId) {
        tab._ytStart = global.FlashYT.parseStart(url) || 0;
        global.FlashYT.open(tab, ytId);
        if (opts.push) pushTabHistory(tab, tab.url);
        global.FlashHistory.push(tab.url, tab.title);
        setStatus("YouTube theater");
        global.FlashTabs.setLoading(tab, false);
        global.FlashTabs.updateChrome();
        return;
      }
      // Non-video YouTube URLs (homepage, channels, playlists, search pages):
      // never proxy the SPA — it redirect-loops straight out of the tunnel.
      // Land on the watch hub instead (carrying any search query).
      try {
        const q = new URL(url).searchParams.get("search_query");
        if (q) global.FlashStore.set("watchQ", q);
      } catch {}
      loadInTab(tab, "flash://watch", opts);
      return;
    }

    // page bug or an escaped internal URL — refuse loudly instead of failing
    // deep inside the transport with a cryptic error.
    if (!/^https?:\/\//i.test(url)) {
      global.FlashTabs.setLoading(tab, false);
      toast("Refused navigation to non-web URL");
      return;
    }

    if (global.FlashAdblock.isBlocked(url)) {
      blockPage(tab, url);
      return;
    }
    tab.view = "web";
    tab.internal = null;

    // recoveries) to the same pipeline in rapid succession stop at an error
    // card instead of spinning forever. Explicit user actions pass
    // manual:true, which bypasses and resets the counter.
    const nowAuto = Date.now();
    tab._autoLoads = (tab._autoLoads || []).filter((t) => nowAuto - t < 15000);
    if (opts.manual) {
      tab._autoLoads = [];
    } else {
      tab._autoLoads.push(nowAuto);
      if (tab._autoLoads.length > 4) {
        tab._autoLoads = [];
        const frame0 = global.FlashTabs.showWeb(tab);
        paintError(frame0, url, new Error("Stopped an automatic reload loop (5 rapid loads in 15s). The page kept requesting a reload before it finished — usually a failed boot script. Fix relays with Benchmark, then Retry."));
        global.FlashTabs.setLoading(tab, false);
        global.FlashTabs.updateChrome();
        setStatus("Stopped a reload loop");
        return;
      }

    const frame = global.FlashTabs.showWeb(tab);
    global.FlashTabs.setLoading(tab, true);
    // While enrichment is pending, the base page may still be settling —
    // same-URL reloads arriving now are premature (live enrichment is still
    // filling the page), so the bridge drops them instead of restarting
    // the pipeline.
    tab._enrichPending = true;
    // Staged status: first visit still boots the ~2MB WASM engine from CDN,
    // so say so instead of a generic "Connecting" while it downloads.
    try {
      setStatus(global.FlashTransport.getStatus().ready
        ? "Connecting via " + shortWisp() + " …"
        : "Loading proxy engine (first visit downloads ~2MB) …");
    } catch {
      setStatus("Connecting via " + shortWisp() + " …");
    }
    // No interstitial: the previous page stays visible while the next loads.
    // Fresh tabs (nothing rendered yet) get a flat backdrop: no white flash.
    if (!frame.getAttribute("srcdoc") && !frame._flashBlob && !frame.getAttribute("src")) paintFreshBackdrop(frame);
    // The whole pipeline gets 60s. Tunnel fetches to filtered hosts can hang
    // (TCP blackholes don't RST), and a hung main fetch used to sit on the
    // loadbar forever. Now it becomes an error card with a retry button.
    const LOAD_TIMEOUT_MS = 60000;
    const loadTimeout = new Promise((_, rej) =>
      setTimeout(() => rej(new Error("Timed out loading page (60s) — try another relay")), LOAD_TIMEOUT_MS));
    let loadedKind = null;
    try {
      const { kind, srcdoc, title, resp, enrich, iconUrl } = await Promise.race([
        global.FlashRewrite.loadPage(url, { tabId: tab.id, zoom: tab.zoom || 100 }),
        loadTimeout,

      tab.url = resp.finalUrl || url;

      // leaks); recovery-triggered loads preserve it (one recovery per URL).
      if (!tab._recovering) tab._recoveredFor = null;

        // into the running page (no document swap: scripts never re-execute,
        // media never restarts, scroll never jumps). The enriched HTML still
        // lands in the per-tab cache so back/forward stays instant.
        const tok = (tab._renderToken = (tab._renderToken || 0) + 1);
        const finalUrl = tab.url;
        if (global.FlashRewrite.enrichDoc) {
          Promise.resolve().then(async () => {
            try {
              const full = await enrich((patch) => {
                if (tab._renderToken !== tok || tab.url !== finalUrl) return;
                const f = document.getElementById("frame-" + tab.id);
                if (!f || !f.contentWindow) return;
                try {

                    f.contentWindow.postMessage({ __flash: 2, tab: tab.id, type: "img-patch", items: [{ url: patch.url, data: patch.dataUrl }] }, "*");

      global.FlashHistory.push(tab.url, tab.title);

      // other path clears it here so reload suppression never sticks.

  // Tab favicons: fetched through the tunnel once per origin, cached as blob

  const favCache = new Map();
  const FAV_MAX_BYTES = 100 * 1024;

  function faviconFor(url) {
    try {
      const o = new URL(url).origin;
      return favCache.get(o) || null;
    } catch {
      return null;
    }
  }

  function fetchFavicon(tab, pageUrl, iconUrl) {
    const myUrl = pageUrl;
    Promise.resolve().then(async () => {
      try {
        // Favicon proxy toggle: off = Google's favicon service (may fail on
        // some networks, but avoids tunnel bytes); on = tunnel + blob cache.
        let useGoogle = false;
        try { useGoogle = global.FlashStore.getSettings().faviconProxy === false; } catch {}
        if (useGoogle) {
          try {
            const host = new URL(pageUrl).hostname;
            const g = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
            favCache.set(new URL(pageUrl).origin, g);

          } catch {}
          return;

        if (!iconUrl || faviconFor(pageUrl)) return;
        const resp = await global.FlashTransport.fetchViaTransport(iconUrl, { kind: "image", pageUrl });

        if (!resp.body || !resp.body.length || resp.body.length > FAV_MAX_BYTES) return;
        if (ct && !ct.startsWith("image/") && !ct.includes("icon")) return;
        const blob = URL.createObjectURL(new Blob([resp.body], { type: ct || "image/x-icon" }));
        try {
          favCache.set(new URL(pageUrl).origin, blob);
        } catch {}
        while (favCache.size > 100) {
          const first = favCache.keys().next().value;
          try { URL.revokeObjectURL(favCache.get(first)); } catch {}

  const PAGE_CACHE_MAX = 20;

    const entries = Array.from(tab.pageCache.entries()).sort((a, b) => a[1].t - b[1].t);

    for (const [u] of entries) {

      global.FlashTabs.setTitle(t, hit.title);

    frame.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${docCss()}</style></head><body class="fcard-page"><div class="fcard"><div class="fcard-ok"><span class="fcard-ic ok">${shield}</span><div><h3>Blocked by Flash shields</h3><div class="fcard-url">${global.FlashUtil.escapeHtml(url)}</div></div></div><p class="fcard-tip">This host is on the ad/tracker blocklist. Allow it in Settings → Privacy, or pause shields for this site from the toolbar.</p></div></body></html>`;

      if (t) loadInTab(t, t.url, { push: false, manual: true });
      return;
    }
    if (m.type === "ui-settings") {
      navigate("flash://settings");
      return;
    }
    const tab = m.tab === "*" ? global.FlashTabs.active() : global.FlashTabs.get(m.tab);
    if (!tab) return;
    const d = m.data || {};
    switch (m.type) {

        // page are dropped — the live enrichment in flight fixes what the page is
        // complaining about (boot-error reload loops die here). Anything
        // else, or anything post-swap, loads normally.
        const sameReload = d.url && tab.url &&

  let findState = { tab: null, q: "", seq: 0 };

  function findOpen() {
    const t = global.FlashTabs.active();
    if (!t || t.view !== "web") {
      toast("Find works on web pages");
      return;
    }
    const bar = $("findBar");
    bar.hidden = false;
    const inp = $("findInput");
    inp.value = "";
    setFindCount("", "");
    findState = { tab: t.id, q: "", seq: 0 };
    inp.focus();
    inp.select();

  function findClose() {
    $("findBar").hidden = true;
  }

    const el = $("findCount");

    el.className = cls || "";
  }

    const q = $("findInput").value;
    const t = global.FlashTabs.get(findState.tab);
    const f = t ? document.getElementById("frame-" + t.id) : null;
    if (!q || !f) {
      setFindCount(q ? "—" : "", "");
      return;
    }
    findState.q = q;
    const mySeq = ++findState.seq;
    const id = "find" + Date.now() + mySeq;

      const m = e.data;
      if (!m || m.__flash !== 1 || m.type !== "find-result" || !m.data || m.data.id !== id) return;

  const ZOOM_STEPS = [50, 67, 75, 80, 90, 100, 110, 125, 150, 175, 200];

  function sendZoom(tab, tries) {
    const f = document.getElementById("frame-" + tab.id);
    if (!f) return;
    try {
      f.contentWindow.postMessage({ __flash: 2, tab: tab.id, type: "zoom", level: tab.zoom || 100 }, "*");

        if (global.FlashTabs.get(tab.id) === tab) sendZoom(tab, (tries || 0) + 1);

  function stepZoom(tab, dir) {
    const cur = tab.zoom || 100;
    let idx = 0;
    for (let i = 0; i < ZOOM_STEPS.length; i++) {

    idx = Math.min(ZOOM_STEPS.length - 1, Math.max(0, idx + dir));
    setZoom(tab, ZOOM_STEPS[idx]);

    });
    // Engine state stays queryable via FlashTransport.getStatus() (About page,
    // Assistant status). No chrome readout by design.
    global.FlashSettings.applyAppearance();
    global.FlashSettings.applyToolbar();
    // Full UI translation (chrome, new tab, store, tutorial, assistant).
    try { global.FlashI18n.apply(); } catch {}
    try { global.FlashTutorial.init(); } catch {}
    // Customizer builds: hide whole features before first paint.
    try {
      const ff = global.FLASH_FEATURES || {};
      const hasAssistant = global.FlashAssistant && typeof global.FlashAssistant.init === "function";
      if (ff.bolt === false || ff.showAI === false || ff.modBolt === false) {
        const b = document.getElementById("btnAssistant");
        if (b) b.style.display = "none";
        const p = document.getElementById("assistantPanel");
        if (p) p.style.display = "none";
      } else if (hasAssistant) {
        global.FlashAssistant.init();
      }
      if (ff.devtools === false || ff.modDevtools === false) {
        const d = document.getElementById("btnCode");
        if (d) d.style.display = "none";
      }
      if (ff.shieldButton === false || ff.privacyBlocking === false) {
        const sh = document.getElementById("protectPill");
        if (sh) sh.style.display = "none";
      }
    } catch {}
    // Fullscreen on launch (best-effort: browsers require a gesture, so a
    // rejection just means the user stays windowed).
    try {
      if (global.FlashStore.getSettings().fullscreenOnLaunch) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      }
    } catch {}
    global.FlashTabs.create("flash://newtab");
    global.FlashChrome.renderBookmarks();
    bindChrome();
    applyDevtoolsVisibility();
    applyI18nLabels();
    // Warm the WASM engine in the background so the first navigation
    // doesn't pay the CDN download cost. Silent on failure (lazy path remains).
    try { global.FlashTransport.warmup(); } catch {}
    // Fastest-relay-first: when idle, handshake the pool in parallel and
    // reorder (stale >12h or never). Browsing then starts on the quickest
    // relay instead of list order. Silent; manual Benchmark still exists.
    try {
      const runBench = () => {
        try {
          const s = global.FlashStore.getSettings();
          if (!s.poolEnabled) return;
          const last = global.FlashStore.get("poolBenchmarkAt", 0) || 0;
          if (Date.now() - last > 12 * 3600 * 1000) {
            Promise.resolve(global.FlashTransport.backgroundBenchmark()).catch(() => {});
          }
        } catch {}
      };
      if (window.requestIdleCallback) {
        requestIdleCallback(() => setTimeout(runBench, 0), { timeout: 5000 });
      } else {
        setTimeout(runBench, 3000);
      }
    } catch {}
    setStatus("Ready");
    document.dispatchEvent(new CustomEvent("flash:ready"));
    // First-run tutorial overlay.
    try {
      const s = global.FlashStore.getSettings();
      const ff = global.FLASH_FEATURES || {};
      const tutOff = ff.tutorial === false || ff.showTutorial === false || ff.tutorialInclude === false;
      if (!tutOff && !s.tutorialDone && s.tutorialAutoStart !== false) {
        setTimeout(() => startTutorial(false), 600);
      }
    } catch {}
  }

  // Devtools split toggles: hide individual Diagnostics tabs at runtime.
  function applyDevtoolsVisibility() {
    let s = {};
    try { s = global.FlashStore.getSettings(); } catch {}
    const map = { requests: "showLogs", dom: "showInspector", metrics: "showMetrics" };
    for (const [pane, key] of Object.entries(map)) {
      const on = s[key] !== false;
      document.querySelectorAll(`#diagPanel .ptab[data-pane="${pane}"]`).forEach((el) => { el.style.display = on ? "" : "none"; });
      const pg = document.getElementById("pane-" + pane);
      if (pg && !on) pg.classList.remove("on");
    }
    // If the active tab got hidden, fall back to the first visible one.
    try {
      const anyOn = document.querySelector("#diagPanel .pane.on");
      if (!anyOn) {
        const first = Object.keys(map).find((p) => (s[map[p]] !== false));
        if (first) openDiag(first);
      }
    } catch {}
  }

  // Guided tour: delegated to the spotlight engine (js/tutorial.js).
  function startTutorial(fromSettings) {
    try {
      const ff = global.FLASH_FEATURES || {};
      if (ff.tutorial === false || ff.showTutorial === false || ff.tutorialInclude === false) {
        if (fromSettings) toast("Tutorial isn't included in this build");
        return;
      }
    } catch {}
    try {
      global.FlashTutorial.start();
    } catch {}
  }

  // Two independent floating windows: assistant and diagnostics.
  function openDiag(pane) {
    const p = $("diagPanel");
    if (!p) return;
    let s = {};
    try { s = global.FlashStore.getSettings(); } catch {}
    const map = { requests: "showLogs", dom: "showInspector", metrics: "showMetrics" };
    if (pane && s[map[pane]] === false) {
      pane = Object.keys(map).find((k) => s[map[k]] !== false) || null;
      if (!pane) { toast("All diagnostics panels are disabled in Settings"); return; }
    }
    p.classList.add("open");
    if (pane) {
      document.querySelectorAll("#diagPanel .ptab").forEach((x) => x.classList.toggle("on", x.dataset.pane === pane));
      document.querySelectorAll("#diagPanel .pane").forEach((pg) => pg.classList.toggle("on", pg.id === "pane-" + pane));
    }
    if (!pane || pane === "metrics") global.FlashInspector.renderMetrics();
    if (!pane || pane === "requests") global.FlashLog.render();
  }

  function toggleDiag(pane) {
    const p = $("diagPanel");
    if (!p) return;
    const target = pane || "requests";
    const paneEl = document.getElementById("pane-" + target);
    if (p.classList.contains("open") && paneEl && paneEl.classList.contains("on")) {
      p.classList.remove("open");
      return;
    }
    openDiag(target);
  }

  function toggleAssistant() {
    try {
      const ff = global.FLASH_FEATURES || {};
      if (ff.bolt === false || ff.showAI === false || ff.modBolt === false) {
        toast("AI Assistant isn't included in this build");
        return;
      }
    } catch {}
    const p = $("assistantPanel");
    if (!p) return;
    p.classList.toggle("open");
  }

  function syncProtectMenu() {
    const s = global.FlashStore.getSettings();
    const set = (id, v) => { const el = $(id); if (el) el.checked = !!v; };
    set("pmAdblock", s.adblockEnabled);
    set("pmCosmetic", s.cosmeticFiltering);
    set("pmWebRTC", s.blockWebRTC);
    const c = $("pmCount");
    if (c) {
      try {
        const st = global.FlashAdblock.stats();
        c.textContent = `${st.page} blocked on this page · ${st.total} total`;
      } catch {
        c.textContent = "";
      }
    }
  }

  // Safe binder: stripped builds lack some controls; never crash boot.
  function on(id, ev, fn) {
    const el = $(id);
    if (el) el.addEventListener(ev, fn);
  }

  function bindChrome() {
    const omni = $("omnibox");
    const go = () => navigate(omni.value);
    $("btnGo").onclick = go;
    omni.onkeydown = (e) => { if (e.key === "Enter") go(); };
    $("btnBack").onclick = goBack;
    $("btnFwd").onclick = goForward;
    $("btnReload").onclick = reload;
    $("btnHome").onclick = () => navigate("flash://newtab");
    $("btnSettings").onclick = () => navigate("flash://settings");
    on("btnCode", "click", () => toggleDiag("requests"));
    on("btnAssistant", "click", () => toggleAssistant());
    on("assistantClose", "click", () => toggleAssistant());
    on("diagClose", "click", () => { const p = $("diagPanel"); if (p) p.classList.remove("open"); });
    // Shields popup (absent when adblock is stripped).
    const pmenu = $("protectMenu");
    if (pmenu && $("protectPill")) {
    $("protectPill").onclick = (e) => {
      e.stopPropagation();
      syncProtectMenu();
      pmenu.classList.toggle("open");
    };
    document.addEventListener("click", (e) => {
      if (!pmenu.contains(e.target)) pmenu.classList.remove("open");
    });
    const saveShields = () => {
      global.FlashStore.saveSettings({
        adblockEnabled: $("pmAdblock").checked,
        cosmeticFiltering: $("pmCosmetic").checked,
        blockWebRTC: $("pmWebRTC").checked,
      });
      global.FlashTabs.updateChrome();
    };
    on("pmAdblock", "change", saveShields);
    on("pmCosmetic", "change", saveShields);
    on("pmWebRTC", "change", saveShields);
    on("pmSettings", "click", () => { pmenu.classList.remove("open"); navigate("flash://settings"); });
    // Per-site pause: adds the current host to the allowlist (Settings → Privacy).
    if (!$("pmPause")) {
      const b = document.createElement("button");
      b.className = "btn small";
      b.id = "pmPause";
      b.style.margin = "4px 6px 6px";
      b.style.width = "calc(100% - 12px)";
      b.style.justifyContent = "center";
      b.textContent = T("pauseSite");
      b.onclick = () => {
        const t = global.FlashTabs.active();
        const host = t ? global.FlashUtil.hostOf(t.url) : "";
        if (!host || t.url.startsWith("flash://")) { toast("Open a web page first"); return; }
        const cur = global.FlashStore.getSettings().pausedSites || "";
        const list = String(cur).split(/[\n,]+/).map((x) => x.trim().toLowerCase()).filter(Boolean);
        if (!list.includes(host)) list.push(host);
        global.FlashStore.saveSettings({ pausedSites: list.join("\n") });
        pmenu.classList.remove("open");
        toast("Adblock paused for " + host);
      };
      pmenu.appendChild(b);
    }
    }
    on("btnStar", "click", toggleBookmarkCurrent);
    // Apps menu (overflow actions).
    const menu = $("appsMenu");
    $("btnApps").onclick = (e) => {
      e.stopPropagation();
      menu.classList.toggle("open");
      const t = global.FlashTabs.active();
      const m = document.querySelector("#mMute span");
      if (m && t) m.textContent = t.muted ? T("mUnmute") : T("mMute");
      const bb = document.querySelector("#mBar span");
      if (bb) bb.textContent = global.FlashStore.getSettings().bookmarksBar ? T("mBarHide") : T("mBarShow");
    };
    document.addEventListener("click", (e) => {
      if (!menu.contains(e.target)) menu.classList.remove("open");
    });
    $("mNewTab").onclick = () => { menu.classList.remove("open"); global.FlashTabs.create("flash://newtab"); };
    $("mHome").onclick = () => { menu.classList.remove("open"); navigate("flash://newtab"); };
    $("mHist").onclick = () => { menu.classList.remove("open"); navigate("flash://history"); };
    $("mMute").onclick = () => { menu.classList.remove("open"); global.FlashTabs.toggleMute(); };
    $("mBar").onclick = () => {
      menu.classList.remove("open");
      const s = global.FlashStore.getSettings();
      const next = !s.bookmarksBar;
      global.FlashStore.saveSettings({ bookmarksBar: next, showBookmarksBar: next });
      global.FlashChrome.renderBookmarks();
    };
    $("mCopy").onclick = () => { menu.classList.remove("open"); copyLink(); };
    $("mBlank").onclick = () => { menu.classList.remove("open"); openAboutBlank(); };
    $("mSave").onclick = () => { menu.classList.remove("open"); downloadStandaloneHint(); };
    $("mDup").onclick = () => { menu.classList.remove("open"); global.FlashTabs.duplicate(); };
    $("mReopen").onclick = () => { menu.classList.remove("open"); global.FlashTabs.reopen(); };
    $("mReset").onclick = () => { menu.classList.remove("open"); global.FlashSettings.resetAll(); };
    // panel tabs (diagnostics window; absent when devtools stripped)
    document.querySelectorAll("#diagPanel .ptab").forEach((b) => {
      b.onclick = () => openDiag(b.dataset.pane);
    });
    on("reqFilter", "input", () => global.FlashLog.render());
    on("reqClear", "click", () => global.FlashLog.clear());
    on("btnInspect", "click", () => global.FlashInspector.inspectActive());
    on("btnPick", "click", () => {
      if (global.FlashInspector.isPicking()) global.FlashInspector.stopPicker();
      else { openDiag("dom"); global.FlashInspector.startPicker(); }
    });
    // find bar
    $("findInput").oninput = findDebounced;
    $("findInput").onkeydown = (e) => {
      if (e.key === "Enter") findAsk(e.shiftKey);
      else if (e.key === "Escape") findClose();
    };
    $("findNext").onclick = () => findAsk(false);
    $("findPrev").onclick = () => findAsk(true);
    $("findClose").onclick = findClose;
    // Fast search suggestions under the omnibox.
    try {
      if (global.FlashSuggest) {
        global.FlashSuggest.attach($("omnibox"), $("suggestBox"), (v) => navigate(v));
      }
    } catch {}
    function toggleBookmarkCurrent() {
    const t = global.FlashTabs.active();
    if (t && t.url && !t.url.startsWith("flash://")) {
      global.FlashBookmarks.toggle(t.url, t.title);
      global.FlashTabs.updateChrome();
    }
  }

    // global shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !$("findBar").hidden) {
        // Don't steal Esc from the inspector picker modeless state.
        if (document.activeElement === $("findInput") || !global.FlashInspector.isPicking()) findClose();
        return;
      }
      const act = global.FlashSettings.matchesShortcut(e);
      if (!act) return;
      e.preventDefault();
      if (act === "newtab") global.FlashTabs.create("flash://newtab");
      if (act === "closetab") { const t = global.FlashTabs.active(); if (t) global.FlashTabs.close(t.id); }
      if (act === "reopen") global.FlashTabs.reopen();
      if (act === "focus-url") omni.focus(), omni.select();
      if (act === "find") findOpen();
      if (act === "zoom-in") { const t = global.FlashTabs.active(); if (t) stepZoom(t, 1); }
      if (act === "zoom-out") { const t = global.FlashTabs.active(); if (t) stepZoom(t, -1); }
      if (act === "zoom-reset") { const t = global.FlashTabs.active(); if (t) setZoom(t, 100); }
      if (act === "reload") reload();
      if (act === "back") goBack();
      if (act === "forward") goForward();
      if (act === "bookmark") toggleBookmarkCurrent();
      if (act === "mute") global.FlashTabs.toggleMute();
      if (act === "home") navigate("flash://newtab");
      if (act === "assistant") toggleAssistant();
      if (act === "devtools") toggleDiag("requests");
    });
  }

  global.FlashApp = { boot, navigate, loadInTab, goBack, goForward, reload, openAboutBlank, toast, openDiag, toggleDiag, toggleAssistant, faviconFor, startTutorial, applyDevtoolsVisibility, applyI18nLabels };
})(window);

</script>
<script>
  window.addEventListener("DOMContentLoaded", () => {
    FlashIcons.apply(document);
    FlashApp.boot();
  });
</script>
</body>
</html>
